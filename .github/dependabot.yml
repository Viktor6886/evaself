# =====================================================================
# Мониторинг зависимостей (шаг 01, пункт 5).
#
# Обновления приходят пакетами и еженедельно, а не по одному на каждый
# патч: шум приводит к тому, что обновления перестают читать, и это
# опаснее, чем задержка в несколько дней.
#
# МАЖОРНЫЕ версии Dependabot не предлагает вовсе. Причина не в
# осторожности ради осторожности, а в протоколе репозитория: «один шаг —
# одна ветка и один pull request». Мажор ломает API и требует правки кода
# и прогона регрессии, то есть это работа шага, а не автоматического PR.
# Обновление Agent SDK, например, — это шаг 11.
#
# Первый прогон этой конфигурации открыл десять PR, из них семь мажорных,
# включая ioredis 5 -> 6: на нём держатся Valkey-локи UserQueue, сессии
# Mini App и rate limits. Такой PR нельзя мержить «между делом».
#
# Обновления БЕЗОПАСНОСТИ ограничение ниже не отсекает: условия
# `version-update:*` относятся только к обычным обновлениям версий.
# =====================================================================
version: 2

updates:
  - package-ecosystem: npm
    directory: /eva-agent-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Обновления внутри одной мажорной версии почти всегда безопасны и
      # разбирать их по отдельности незачем.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Мажоры не предлагаются: см. шапку файла.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Letta по той же причине, что и мажоры: подъём Agent SDK — работа
      # шага, а не автоматического PR. Версия пакета связана с версией
      # App Server: SDK 0.7.1 тянет letta-code 0.30.11, и ровно эти
      # значения стоят в versions.env, откуда собирается образ App
      # Server. Обновить один package.json значит развести рантайм и
      # клиент по разным версиям одного протокола. Плюс матрицу
      # возможностей (VERIFIED_VERSIONS) обязан перепроверить человек, и
      # contract-тест намеренно краснеет, пока он этого не сделал.
      #
      # Из-за этого групповой PR приходил заведомо красным и тянул за
      # собой безобидные bullmq и fastify, которые иначе вливаются сами.
      # Обновления БЕЗОПАСНОСТИ это условие не отсекает.
      - dependency-name: "@letta-ai/*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /media-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Экшены и базовые образы обновляются раз в месяц. Каждый их pull
  # request стоит полного прогона CI (около четырнадцати биллинговых
  # минут), а версии здесь меняются медленно: еженедельный опрос платит
  # за проверку того, что почти всегда не изменилось. Обновления
  # БЕЗОПАСНОСТИ приходят вне расписания и этой правкой не задержаны.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Базовые образы локальной сборки. Теги upstream-сервисов живут в
  # versions.env и обновляются через `make update-preview`, а не здесь.
  - package-ecosystem: docker
    directories:
      - /eva-agent-service
      - /media-service
      - /letta-app-server
      - /backup-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
