name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===================================================================
  # Shell, compose, Caddy, migrations, secret scan
  # ===================================================================
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and Caddy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          CADDY_VERSION="$(grep '^CADDY_VERSION=' versions.env | cut -d= -f2 | cut -d- -f1)"
          curl -fsSL -o /tmp/caddy.tgz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          sudo tar xzf /tmp/caddy.tgz -C /usr/local/bin caddy
          caddy version

      - name: Bash syntax
        run: |
          for f in scripts/*.sh backup-service/backup-service letta-app-server/entrypoint.sh; do
            bash -n "$f" || exit 1
          done

      - name: NocoDB automatic connection unit tests
        run: node --test nocodb/init-eva.test.mjs

      - name: .env loader treats bcrypt and JSON as data
        run: |
          cat > /tmp/evaself-loader.env <<'EOF'
          LETTA_UI_PASSWORD_HASH='$2a$14$placeholderplaceholderpl'
          EVA_LLM_ADDITIONAL_PARAMETERS='{"request_timeout_ms":180000}'
          EOF
          ENV_FILE=/tmp/evaself-loader.env VERSIONS="$PWD/versions.env" bash -euo pipefail -c '
            . scripts/lib.sh
            load_env
            test "$LETTA_UI_PASSWORD_HASH" = "\$2a\$14\$placeholderplaceholderpl"
            test "$EVA_LLM_ADDITIONAL_PARAMETERS" = "{\"request_timeout_ms\":180000}"
          '

      - name: Installer defaults and skipped optional settings
        run: |
          ENV_FILE=/tmp/evaself-config.env \
          EVASELF_NONINTERACTIVE=1 \
          EVASELF_SKIP_PASSWORD_HASH=1 \
            ./scripts/configure.sh
          ENV_FILE=/tmp/evaself-config.env VERSIONS="$PWD/versions.env" bash -euo pipefail -c '
            . scripts/lib.sh
            load_env
            test "$DOMAIN" = "evaself.localhost"
            test "$DOMAIN_APP" = "app.evaself.localhost"
            test "$DOMAIN_NOCODB" = "nocodb.evaself.localhost"
            test -z "$EVA_TELEGRAM_BOT_TOKEN"
            test -z "$EVA_LLM_API_KEY"
            test "$EVA_LLM_ADDITIONAL_PARAMETERS" = "{\"request_timeout_ms\":180000}"
            [[ "$EVASELF_INCOMPLETE_SETTINGS" == *"Telegram Bot Token"* ]]
            [[ "$EVASELF_INCOMPLETE_SETTINGS" == *"LLM-провайдер"* ]]
            is_email "operator+alerts@example.com"
            ! is_email "operator@example"
          '

      - name: "`make update` returns to the release branch by itself"
        run: ./scripts/ci/test-release-branch.sh

      - name: An update tells behind from diverged
        run: ./scripts/ci/test-ahead-behind.sh

      # Взятый не тот ключ не мешает архиву создаться и провериться —
      # расхождение всплывает при восстановлении, когда исходной установки
      # уже нет. Поэтому архивы здесь шифруются и расшифровываются по-настоящему.
      - name: Backup archive password selection round-trips
        run: ./scripts/ci/test-backup-password.sh

      # Тот же несимметричный риск, но с другой стороны: путь к мастер-ключу
      # restore.sh брал из .env, который читал почти на сто строк ниже
      # расшифровки. Архив создавался и проверялся, а не открывался уже при
      # восстановлении. Здесь restore.sh запускается по-настоящему.
      - name: Restore finds the installation's master key
        run: ./scripts/ci/test-restore-master-key.sh

      # .env должны читать оба разборщика. Проверка ниже («Installer
      # defaults») использует только load_env, и апостроф в списке
      # незавершённых настроек ломал docker compose незаметно для CI.
      - name: The generated .env is readable by compose and by load_env
        run: ./scripts/ci/test-env-compose-parse.sh

      # Уязвимость в зависимости не видна в обычных тестах: они зелёные
      # ровно до инцидента. Список принятых исключений — в самом скрипте,
      # поимённо и с причиной; новая уязвимость high вне списка валит CI.
      - name: Dependency audit (npm and pip)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pip-audit
          ./scripts/ci/audit-dependencies.sh

      - name: The LLM Router is the only way out to a model
        run: |
          # Прямое обращение к провайдеру в обход роутера возвращает
          # прежнюю проблему: смена провайдера снова потребует правки кода
          # и перезапуска App Server.
          if grep -rn "chat/completions" eva-agent-service/src \
               --include="*.ts" \
               | grep -v "^eva-agent-service/src/router/" \
               | grep -v "routerUrl"; then
            echo "::error::обращение к /chat/completions в обход LLM Router"
            exit 1
          fi
          echo "все вызовы моделей идут через роутер"

      - name: An upgrade backfills settings added since installation
        run: |
          # A release that introduces a new .env key used to need a manual
          # edit; make update now adds it. Simulated by taking today's
          # example, filling it in as a configured installation would look,
          # and then removing keys to stand in for "added since install".
          #
          # Deliberately not derived from HEAD~1: actions/checkout is a
          # shallow clone, so that commit does not exist here.
          sed 's/^\([A-Z0-9_]*\)=$/\1=preexisting/' .env.example > /tmp/upgrade.env
          sed -i '/^MEDIA_SERVICE_TOKEN=/d; /^ACME_CA=/d; /^BACKUP_RETENTION_COUNT=/d' /tmp/upgrade.env
          test -s /tmp/upgrade.env
          chmod 600 /tmp/upgrade.env

          ENV_FILE=/tmp/upgrade.env ./scripts/ensure-env-defaults.sh
          ENV_FILE=/tmp/upgrade.env VERSIONS="$PWD/versions.env" bash -euo pipefail -c '
            . scripts/lib.sh
            load_env
            # a missing secret is generated, not copied from the empty example
            [ "${#MEDIA_SERVICE_TOKEN}" -ge 32 ] || { echo "::error::MEDIA_SERVICE_TOKEN not generated"; exit 1; }
            # a missing plain setting is copied verbatim
            test "$ACME_CA" = "https://acme-v02.api.letsencrypt.org/directory"
            test "$BACKUP_RETENTION_COUNT" = "30"
            # quoting survives the round trip
            test "$EVA_LLM_ADDITIONAL_PARAMETERS" = "{\"request_timeout_ms\":180000}"
            # an existing value is never rewritten, and no password is invented
            test "$POSTGRES_SUPER_PASSWORD" = "preexisting"
          '

          # a second run must not change a single byte
          BEFORE="$(sha256sum < /tmp/upgrade.env)"
          ENV_FILE=/tmp/upgrade.env ./scripts/ensure-env-defaults.sh >/dev/null
          test "$BEFORE" = "$(sha256sum < /tmp/upgrade.env)" \
            || { echo "::error::ensure-env-defaults.sh is not idempotent"; exit 1; }
          echo "upgrade backfill ok"

      # scripts/ci/*.sh и postgres/fixtures/*.sh раньше выпадали из проверки:
      # исполняемый shell мог попасть в репозиторий нелинтованным.
      - name: shellcheck
        run: |
          shellcheck -S error -x \
            scripts/*.sh scripts/ci/*.sh postgres/fixtures/*.sh \
            backup-service/backup-service

      - name: Compose renders
        run: |
          sed 's/^\([A-Z0-9_]*\)=$/\1=placeholder/' .env.example > /tmp/ci.env
          docker compose --env-file versions.env --env-file /tmp/ci.env -f compose.yaml config -q
          echo "services: $(docker compose --env-file versions.env --env-file /tmp/ci.env -f compose.yaml config --services | wc -l)"
          docker compose --env-file versions.env --env-file /tmp/ci.env \
            -f compose.yaml config --format json > /tmp/compose.json
          jq -e '.services.caddy.environment.EVA_AGENT_API_KEY == "placeholder"' /tmp/compose.json

      - name: Caddyfiles validate
        env:
          DOMAIN: example.test
          DOMAIN_APP: app.example.test
          DOMAIN_API: api.example.test
          DOMAIN_NOCODB: admin.example.test
          DOMAIN_LETTA: letta.example.test
          DOMAIN_STATUS: status.example.test
          ACME_EMAIL: ops@example.test
          ACME_CA: https://acme-v02.api.letsencrypt.org/directory
          LETTA_UI_USER: admin
          LETTA_UI_PASSWORD_HASH: $2a$14$placeholderplaceholderpl
          EVA_AGENT_PORT: "8070"
          EVA_AGENT_URL: http://eva-agent-service:8070
          EVA_AGENT_API_KEY: placeholder
        run: |
          caddy validate --config Caddyfile
          caddy validate --config webapp/Caddyfile
          caddy validate --config letta-ui/Caddyfile
          caddy validate --config admin-ui/Caddyfile

      - name: Validation works without Caddy installed on the host
        run: |
          sudo mv /usr/local/bin/caddy /usr/local/bin/caddy.disabled
          trap 'sudo mv /usr/local/bin/caddy.disabled /usr/local/bin/caddy' EXIT
          output="$(printf '%s\n' './scripts/validate.sh' 'echo stdin-preserved' | bash)"
          printf '%s\n' "$output"
          grep -q '^stdin-preserved$' <<<"$output"

      - name: Installer does not print generated passwords
        run: |
          if grep -Eq 'NocoDB.*NC_ADMIN_PASSWORD|Letta UI.*LETTA_UI_PASSWORD' scripts/install.sh; then
            echo "::error::installer summary exposes an administrative password"
            exit 1
          fi

      - name: Administrative WebUI JavaScript is valid
        run: |
          node --check letta-ui/public/ui.js
          node --check admin-ui/public/ui.js

      - name: The /v1 deny really precedes the proxy in the adapted config
        env:
          DOMAIN: example.test
          DOMAIN_APP: app.example.test
          DOMAIN_API: api.example.test
          DOMAIN_NOCODB: admin.example.test
          DOMAIN_LETTA: letta.example.test
          DOMAIN_STATUS: status.example.test
          ACME_EMAIL: ops@example.test
          ACME_CA: https://acme-v02.api.letsencrypt.org/directory
          LETTA_UI_USER: admin
          LETTA_UI_PASSWORD_HASH: $2a$14$placeholderplaceholderpl
          EVA_AGENT_PORT: "8070"
          EVA_AGENT_API_KEY: placeholder
        run: |
          # `caddy validate` only proves the file parses. What matters here is
          # ORDER: Caddy sorts a bare `respond` after every `handle`, so a
          # top-level deny on a host that proxies /api/* is silently dead code.
          caddy adapt --config Caddyfile > /tmp/caddy.json
          python3 scripts/ci/assert-caddy-order.py /tmp/caddy.json
          # The Mini App host maps / onto /app. An unguarded rewrite fires on
          # /app/app.css too, which then resolves to index.html and is refused
          # as CSS under nosniff — the page renders, completely unstyled.
          python3 scripts/ci/assert-caddy-prefix-rewrite.py /tmp/caddy.json

      - name: Front-end JavaScript is valid
        run: |
          node --check letta-ui/public/ui.js
          node --check admin-ui/public/ui.js
          node --check webapp/public/app/app.js
          node --check webapp/public/assets/bot-link.js

      - name: Every API path the front-ends call exists in the service
        run: python3 scripts/ci/assert-frontend-routes.py

      # Проверка роли в server.ts начинается с `access.roles &&`, поэтому
      # маршрут, забывший объявить роли, её не проваливает, а пропускает —
      # и становится доступен любому вошедшему, включая viewer.
      - name: Every admin route declares who may call it
        run: python3 scripts/ci/assert-admin-route-access.py

      # Так был потерян EVA_ROUTER_API_KEY: он был в .env.example, в
      # установщике и в апгрейде, исправно создавался на сервере — и не
      # передавался агенту. Каждый файл по отдельности выглядел верным.
      - name: Every variable the service reads is passed to it
        run: python3 scripts/ci/assert-env-plumbing.py

      # Откат нужен ровно в аварии; узнавать тогда, что его файл сломан,
      # поздно. Здесь проверяется хотя бы наличие и снятие версии, а
      # работоспособность — в job migrations на настоящей базе.
      - name: Every admin-era migration has a down file
        run: python3 scripts/ci/assert-down-migrations.py

      - name: No secrets in tracked files
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          if git grep -lIE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|[0-9]{8,}:AA[A-Za-z0-9_-]{30,})' \
               -- . ':(exclude)scripts/validate.sh' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::possible secret material in tracked files"; exit 1
          fi
          echo "clean"

  # ===================================================================
  # eva-agent-service: the Agent SDK integration
  # ===================================================================
  agent-service:
    name: eva-agent-service (TypeScript)
    runs-on: ubuntu-24.04
    env:
      EVA_PROFILE_COMPLETION_ENABLED: "true"
      EVA_VECTOR_GOALS_ENABLED: "true"
      EVA_GRAPH_MEMORY_ENABLED: "true"
      EVA_GRAPH_CONTEXT_TIMEOUT_MS: "75"
      EVA_PROFILE_CACHE_TTL_SECONDS: "60"
      EVA_CONVERSATION_MIRROR_ENABLED: "false"
      EVA_OUTBOX_ENABLED: "true"
    defaults:
      run:
        working-directory: eva-agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # The Agent SDK requires >= 22.19.
          node-version: "22.22"
          cache: npm
          cache-dependency-path: eva-agent-service/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test --experimental-strip-types test/*.test.ts

      - name: The SDK is the official one, and it is actually used
        run: node ../scripts/verify-agent-sdk.mjs .

  # ===================================================================
  # admin-ui: поведение панели в настоящем браузере
  # ===================================================================
  # `node --check` доказывает лишь то, что файл разбирается. Всё, ради
  # чего эти тесты написаны, — отрицательные проверки: какие запросы
  # панель НЕ отправляет. Переписка не должна загружаться при открытии
  # карточки, мутации — уходить до подтверждения sudo, а пустая форма
  # пароля архива — снимать пароль. Ни одно из этих правил не держится
  # сервером: он честно ответит на любой корректный запрос.
  admin-ui:
    name: admin-ui (браузерные тесты)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Behaviour tests
        run: npm test

  # ===================================================================
  # PostgreSQL schema: applied for real, three times, to prove idempotency
  # ===================================================================
  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: eva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: ci
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: eva
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Extensions
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Apply migrations three times (must be idempotent)
        run: |
          for pass in 1 2 3; do
            echo "== migration pass $pass"
            for f in postgres/migrations/*.sql; do
              echo "== $f"
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      - name: The schema is what the services expect
        run: |
          psql -v ON_ERROR_STOP=1 -tA <<'SQL'
          DO $$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(t, ', ') INTO missing
            FROM unnest(ARRAY[
              'users','agent_links','agent_conversations','subscriptions','payments',
              'quotas','usage_counters','onboarding_fields','tasks','crisis_events',
              'schema_migrations','llm_providers','llm_routes','llm_route_providers',
              'llm_requests','llm_spend_ledger','llm_breaker_state',
              'sdk_settings','telegram_updates',
              'telegram_outbox','timezone_aliases','profile_field_definitions',
              'user_preferences','eva_notes','budget_entries','heartbeat_state',
              'payment_intents','admin_audit_log','user_north','goals',
              'goal_results','goal_dependencies','work_blocks','goal_reviews',
              'goal_recommendations','user_strategies','learning_attempts',
              'memory_nodes','memory_edges','conversation_highlights',
              'admin_users','admin_sessions','sudo_grants','system_settings',
              'config_versions','secret_records','audit_log',
              'integration_configs','provider_configs','provider_models',
              'provider_key_pools','provider_keys','health_checks',
              'service_statuses','admin_operations','backups','update_history'
            ]) AS t
            WHERE to_regclass('public.' || t) IS NULL;
            IF missing IS NOT NULL THEN RAISE EXCEPTION 'missing tables: %', missing; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'agent_links' AND column_name = 'conversation_id'
            ) THEN RAISE EXCEPTION 'agent_links.conversation_id is missing'; END IF;

            IF to_regclass('public.v_agent_runtime') IS NULL THEN
              RAISE EXCEPTION 'v_agent_runtime is missing';
            END IF;
          END $$;
          SQL
          echo "schema verified"

      # Роутер помечает чувствительным любой запрос без обратной пометки,
      # поэтому провайдер, заведённый одними обязательными колонками,
      # обязан обслуживать трафик. При умолчании false установка молча
      # отвергала сто процентов запросов.
      - name: A provider created with schema defaults may carry conversation
        run: |
          psql -v ON_ERROR_STOP=1 -tA <<'SQL'
          DO $$
          DECLARE allowed boolean;
          BEGIN
            INSERT INTO llm_providers (name, base_url, model, context_window, api_key_encrypted)
            VALUES ('ci-defaults-probe', 'http://example.test/v1', 'm', 32768, 'v1:a:b:c');
            SELECT sensitive_data_allowed INTO allowed
              FROM llm_providers WHERE name = 'ci-defaults-probe';
            DELETE FROM llm_providers WHERE name = 'ci-defaults-probe';
            IF NOT allowed THEN
              RAISE EXCEPTION 'новый провайдер не допущен к личным данным: роутер отвергнет весь трафик';
            END IF;
          END $$;
          SQL
          echo "provider defaults verified"

      - name: Seed data is not duplicated by a re-run
        run: |
          COUNT="$(psql -tA -c 'SELECT count(*) FROM quotas')"
          [ "$COUNT" = "9" ] || { echo "::error::quotas has $COUNT rows, expected 9"; exit 1; }

      # Откат выполняется ровно тогда, когда что-то уже пошло не так, и
      # проверять его в этот момент поздно. Здесь он прогоняется на
      # заведомо целой базе: назад по всем down, затем снова вперёд.
      - name: Rollback and re-apply (down migrations must actually work)
        run: |
          BEFORE="$(psql -tA -c 'SELECT count(*) FROM schema_migrations')"

          for f in $(ls -r postgres/migrations/down/*.sql); do
            echo "== down $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

          AFTER="$(psql -tA -c 'SELECT count(*) FROM schema_migrations')"
          COUNT="$(ls postgres/migrations/down/*.sql | wc -l)"
          EXPECTED=$((BEFORE - COUNT))
          if [ "$AFTER" != "$EXPECTED" ]; then
            echo "::error::после отката ожидалось $EXPECTED записей schema_migrations, получено $AFTER"
            exit 1
          fi

          for f in postgres/migrations/*.sql; do
            echo "== up $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

          FINAL="$(psql -tA -c 'SELECT count(*) FROM schema_migrations')"
          if [ "$FINAL" != "$BEFORE" ]; then
            echo "::error::после повторного наката ожидалось $BEFORE записей, получено $FINAL"
            exit 1
          fi

          # Схема должна вернуться целиком, а не «почти», и сеяные строки
          # после цикла не должны ни пропасть, ни удвоиться.
          psql -v ON_ERROR_STOP=1 -tA <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.admin_users') IS NULL
               OR to_regclass('public.llm_routes') IS NULL
               OR to_regclass('public.admin_user_notes') IS NULL THEN
              RAISE EXCEPTION 'после отката и наката схема восстановилась не полностью';
            END IF;
            IF (SELECT count(*) FROM quotas) <> 9 THEN
              RAISE EXCEPTION 'quotas после цикла: %', (SELECT count(*) FROM quotas);
            END IF;
            IF (SELECT count(*) FROM llm_routes) <> 10 THEN
              RAISE EXCEPTION 'llm_routes после цикла: %', (SELECT count(*) FROM llm_routes);
            END IF;
          END $$;
          SQL
          echo "rollback verified"

  # ===================================================================
  # media-service
  # ===================================================================
  media-service:
    name: media-service (Python + ffmpeg)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: media-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install --quiet -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Tests (real ffmpeg round-trips)
        env:
          MEDIA_WORK_DIR: /tmp/media
        run: python -m pytest -q

  # ===================================================================
  # Images build (and, for the agent service, its tests run in-build)
  # ===================================================================
  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build every locally built image
        run: |
          set -e
          . ./versions.env
          docker build -t evaself/eva-agent-service:ci \
            --build-arg NODE_BASE_VERSION="$NODE_BASE_VERSION" eva-agent-service
          docker build -t evaself/eva-updater:ci --target updater \
            --build-arg NODE_BASE_VERSION="$NODE_BASE_VERSION" \
            --build-arg DOCKER_CLI_IMAGE="$DOCKER_CLI_IMAGE" \
            --build-arg DOCKER_CLI_VERSION="$DOCKER_CLI_VERSION" eva-agent-service
          docker run --rm evaself/eva-updater:ci sh -c \
            'docker compose version && python3 --version'
          # Выделенная группа сокета updater должна существовать, и node —
          # пользователь admin-api и health-worker — должен в неё входить.
          # Без этого сокет с правами 0660 отрезал бы своих же клиентов.
          docker run --rm evaself/eva-updater:ci sh -c \
            'getent group evaself-updater && id -nG node | tr " " "\n" | grep -qx evaself-updater'
          docker build -t evaself/letta-app-server:ci \
            --build-arg NODE_BASE_VERSION="$NODE_BASE_VERSION" \
            --build-arg LETTA_CODE_VERSION="$LETTA_CODE_VERSION" letta-app-server
          docker build -t evaself/media-service:ci \
            --build-arg PYTHON_BASE_VERSION="$PYTHON_BASE_VERSION" media-service
          docker build -t evaself/webapp:ci \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" --build-arg CADDY_VERSION="$CADDY_VERSION" webapp
          docker build -t evaself/letta-ui:ci \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" --build-arg CADDY_VERSION="$CADDY_VERSION" letta-ui
          docker build -t evaself/admin-ui:ci \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" --build-arg CADDY_VERSION="$CADDY_VERSION" admin-ui
          docker build -t evaself/backup-service:ci \
            --build-arg POSTGRES_IMAGE="$POSTGRES_IMAGE" --build-arg POSTGRES_VERSION="$POSTGRES_VERSION" backup-service

      - name: The App Server image really serves the App Server
        run: |
          docker run --rm evaself/letta-app-server:ci \
            sh -c 'letta server --help' | tee /tmp/help
          grep -q -- '--listen' /tmp/help

  # ===================================================================
  # The whole stack, started for real
  # ===================================================================
  stack:
    name: Stack smoke test
    runs-on: ubuntu-24.04
    needs: [agent-service, images]
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway .env
        run: |
          # Заглушка длиннее 16 символов: сервисы проверяют минимальную
          # длину ключей, и короткое значение роняло бы их в crash loop —
          # ровно так llm-router не поднимался, пока ключ не генерировался.
          sed 's/^\([A-Z0-9_]*\)=$/\1=ci-placeholder-value-32-chars-long/' .env.example > .env
          python3 - <<'PY'
          import re, secrets, pathlib
          path = pathlib.Path('.env')
          text = path.read_text()
          values = {
            'DOMAIN': 'example.test', 'DOMAIN_APP': 'app.example.test',
            'DOMAIN_API': 'api.example.test',
            'DOMAIN_NOCODB': 'admin.example.test', 'DOMAIN_LETTA': 'letta.example.test',
            'DOMAIN_STATUS': 'status.example.test', 'ACME_EMAIL': 'ci@example.test',
            'EVA_AGENT_PORT': '8070', 'LETTA_APP_SERVER_BACKEND': 'local',
            'EVA_TELEGRAM_API_BASE_URL': 'http://127.0.0.1:1',
            'EVA_LLM_PROVIDER_NAME': 'CI-bootstrap', 'EVA_LLM_MODEL': '',
            'EVA_LLM_CONTEXT_WINDOW': '32768',
            'NC_ADMIN_EMAIL': 'admin@example.test',
            'NC_ADMIN_PASSWORD': 'Ci-NocoDB-2026-Strong-Password',
            'EVA_ADMIN_USERNAME': 'admin',
            'EVA_ADMIN_BOOTSTRAP_PASSWORD': 'Ci-Phase1-Strong-Passphrase-2026!',
            'EVA_SECRETS_MASTER_KEY_FILE': '/tmp/evaself-ci-master-key',
            'COMPOSE_PROFILES': '',
          }
          for key, value in values.items():
            text = re.sub(rf'^{key}=.*$', f'{key}={value}', text, flags=re.M)
          for key in ('POSTGRES_SUPER_PASSWORD','EVA_DB_PASSWORD',
                      'NOCODB_DB_PASSWORD','LETTA_DB_PASSWORD','EVA_DB_READONLY_PASSWORD',
                      'VALKEY_PASSWORD','EVA_AGENT_API_KEY','LETTA_APP_SERVER_TOKEN',
                      'LLM_CONFIG_ENCRYPTION_KEY','EVA_ROUTER_API_KEY',
                      'NC_AUTH_JWT_SECRET','LAVA_WEBHOOK_PASSWORD','MEDIA_SERVICE_TOKEN',
                      'SEARXNG_SECRET','EVA_TELEGRAM_WEBHOOK_SECRET'):
            text = re.sub(rf'^{key}=.*$', f'{key}={secrets.token_hex(24)}', text, flags=re.M)
          path.write_text(text)
          PY
          openssl rand -base64 32 > /tmp/evaself-ci-master-key
          chmod 600 /tmp/evaself-ci-master-key
          chmod 600 .env

      - name: Start the data layer and apply migrations
        run: |
          docker compose --env-file versions.env --env-file .env \
            up -d postgres valkey
          for i in $(seq 1 60); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-postgres 2>/dev/null || echo down)"
            echo "PostgreSQL, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            [ "$i" = "60" ] && exit 1
            sleep 2
          done
          ./scripts/db-migrate.sh

      - name: NocoDB automatically imports every Eva table
        run: |
          docker compose --env-file versions.env --env-file .env up -d nocodb
          for i in $(seq 1 90); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-nocodb 2>/dev/null || echo down)"
            echo "NocoDB, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            [ "$i" = "90" ] && exit 1
            sleep 2
          done
          ./scripts/nocodb-connect.sh
          ./scripts/nocodb-connect.sh
          . scripts/lib.sh
          load_env
          IFS='|' read -r BASE_COUNT SOURCE_COUNT MODEL_COUNT <<<"$(
            docker compose --env-file versions.env --env-file .env \
              exec -T -e PGPASSWORD="$NOCODB_DB_PASSWORD" postgres \
              psql -v ON_ERROR_STOP=1 -At \
                -U "$NOCODB_DB_USER" -d "$NOCODB_DB_NAME" \
                -c "SELECT (SELECT count(*) FROM nc_bases_v2),
                           (SELECT count(*) FROM nc_sources_v2),
                           (SELECT count(*) FROM nc_models_v2);"
          )"
          EVA_OBJECT_COUNT="$(
            docker compose --env-file versions.env --env-file .env \
              exec -T -e PGPASSWORD="$EVA_DB_PASSWORD" postgres \
              psql -v ON_ERROR_STOP=1 -At \
                -U "$EVA_DB_USER" -d "$EVA_DB_NAME" \
                -c "SELECT count(*) FROM information_schema.tables
                    WHERE table_schema = 'public'
                      AND table_type IN ('BASE TABLE', 'VIEW');"
          )"
          test "$BASE_COUNT" -eq 1
          test "$SOURCE_COUNT" -eq 1
          test "$MODEL_COUNT" -eq "$EVA_OBJECT_COUNT"
          printf 'NocoDB metadata: bases=%s sources=%s objects=%s\n' \
            "$BASE_COUNT" "$SOURCE_COUNT" "$MODEL_COUNT"

      - name: Start the App Server and the agent service
        run: |
          # media-service and searxng are needed by the auth and network
          # isolation checks further down.
          docker compose --env-file versions.env --env-file .env \
            up -d --build letta-app-server eva-agent-service media-service searxng

      - name: Wait for the agent service to report healthy
        run: |
          for i in $(seq 1 60); do
            STATUS="$(docker compose --env-file versions.env --env-file .env \
              exec -T eva-agent-service node -e "
                fetch('http://127.0.0.1:8070/health')
                  .then(r=>r.json()).then(b=>console.log(b.status))
                  .catch(()=>console.log('down'))" 2>/dev/null | tr -d '\r')"
            echo "attempt $i: $STATUS"
            [ "$STATUS" = "ok" ] && exit 0
            sleep 5
          done
          echo "::error::eva-agent-service never became healthy"
          docker compose --env-file versions.env --env-file .env logs --tail=80 eva-agent-service letta-app-server
          exit 1

      - name: Admin phase 1 — auth, RBAC, sudo, audit and no secret leaks
        run: |
          if ! docker compose --env-file versions.env --env-file .env \
              up -d --build admin-api admin-ui; then
            docker compose --env-file versions.env --env-file .env \
              logs --tail=100 admin-bootstrap admin-api
            exit 1
          fi
          for i in $(seq 1 60); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-admin-api 2>/dev/null || echo down)"
            echo "admin-api, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            [ "$i" = "60" ] && {
              docker compose --env-file versions.env --env-file .env \
                logs --tail=100 admin-bootstrap admin-api
              exit 1
            }
            sleep 2
          done
          docker compose --env-file versions.env --env-file .env \
            exec -T admin-api node --input-type=module - <<'NODE'
          import pg from 'pg';
          import {hash, argon2id} from 'argon2';
          const base = 'http://127.0.0.1:8071/api/admin/v1';
          const password = 'Ci-Phase1-Strong-Passphrase-2026!';
          async function login(username = 'admin') {
            const response = await fetch(base + '/auth/login', {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({username, password}),
            });
            if (!response.ok) throw new Error('login failed: ' + response.status);
            const cookies = response.headers.getSetCookie();
            const cookie = cookies.map(v => v.split(';')[0]).join('; ');
            const csrf = /eva_admin_csrf=([^;]+)/.exec(cookie)?.[1];
            return {cookie, csrf: decodeURIComponent(csrf), user: (await response.json()).user};
          }
          async function call(session, path, options = {}) {
            const headers = {cookie: session.cookie, ...(options.headers || {})};
            if (options.body) headers['content-type'] = 'application/json';
            if (!['GET','HEAD'].includes(options.method || 'GET')) {
              headers['x-csrf-token'] = session.csrf;
            }
            return await fetch(base + path, {...options, headers});
          }
          const session = await login();
          let csrfFailure = await fetch(base + '/sudo', {
            method:'POST',
            headers:{cookie:session.cookie, 'content-type':'application/json'},
            body:JSON.stringify({password, scope:'secrets:write'}),
          });
          if (csrfFailure.status !== 403) throw new Error('CSRF bypass was allowed');
          let response = await call(session, '/settings');
          if (!response.ok || !response.headers.get('etag')) throw new Error('settings GET failed');
          const etag = response.headers.get('etag');
          response = await call(session, '/settings', {
            method:'PUT', headers:{'if-match':etag},
            body:JSON.stringify({settings:{'runtime.telegram_typing_interval_ms':4500}}),
          });
          if (!response.ok) throw new Error('owner settings PUT failed: ' + response.status);
          response = await call(session, '/secrets/sec_ci_acceptance_secret', {
            method:'PUT',
            body:JSON.stringify({value:'known-ci-secret-must-never-leak', used_by:['admin-api']}),
          });
          if (response.status !== 403) throw new Error('secret write without sudo was allowed');
          response = await call(session, '/sudo', {
            method:'POST', body:JSON.stringify({password, scope:'secrets:write'}),
          });
          if (response.status !== 201) throw new Error('sudo grant failed');
          response = await call(session, '/secrets/sec_ci_acceptance_secret', {
            method:'PUT',
            body:JSON.stringify({value:'known-ci-secret-must-never-leak', used_by:['admin-api']}),
          });
          if (!response.ok) throw new Error('secret write with sudo failed');
          const metadata = await response.text();
          if (metadata.includes('known-ci-secret-must-never-leak')) throw new Error('secret leaked in PUT');
          const pool = new pg.Pool({connectionString:process.env.DATABASE_URL});
          await pool.query(
            `UPDATE sudo_grants
                SET granted_at = now() - interval '11 minutes',
                    expires_at = now() - interval '1 minute'`,
          );
          response = await call(session, '/secrets/sec_ci_acceptance_secret', {
            method:'PUT',
            body:JSON.stringify({value:'known-ci-secret-must-never-leak', used_by:['admin-api']}),
          });
          if (response.status !== 403) throw new Error('expired sudo grant was accepted');

          const roleHash = await hash(password, {
            type:argon2id, memoryCost:19456, timeCost:2, parallelism:1, hashLength:32,
          });
          for (const role of ['admin','operator','viewer']) {
            await pool.query(
              `INSERT INTO admin_users(username,password_hash,role)
               VALUES($1,$2,$3) ON CONFLICT DO NOTHING`,
              ['ci-' + role, roleHash, role],
            );
          }
          for (const role of ['owner','admin','operator','viewer']) {
            const roleSession = role === 'owner' ? session : await login('ci-' + role);
            for (const path of ['/me','/settings','/audit?limit=500']) {
              const result = await call(roleSession, path);
              const text = await result.text();
              if (!result.ok) throw new Error(role + ' cannot GET ' + path);
              if (text.includes('known-ci-secret-must-never-leak') ||
                  text.includes('Ci-Phase1-Strong-Passphrase-2026!')) {
                throw new Error('secret leaked to ' + role + ' from ' + path);
              }
            }
            const secretList = await call(roleSession, '/secrets');
            if ((['owner','admin'].includes(role)) !== secretList.ok) {
              throw new Error('secret metadata RBAC mismatch for ' + role);
            }
            const current = await call(roleSession, '/settings');
            const currentEtag = current.headers.get('etag');
            const mutation = await call(roleSession, '/settings', {
              method:'PUT', headers:{'if-match':currentEtag},
              body:JSON.stringify({settings:{'runtime.telegram_typing_interval_ms':4600}}),
            });
            if ((['owner','admin'].includes(role)) !== mutation.ok) {
              throw new Error('settings RBAC mismatch for ' + role + ': ' + mutation.status);
            }
          }
          for (const path of ['/me','/settings','/secrets','/audit?limit=500']) {
            const result = await call(session, path);
            const text = await result.text();
            if (!result.ok) throw new Error(path + ' failed');
            if (text.includes('known-ci-secret-must-never-leak') ||
                text.includes('Ci-Phase1-Strong-Passphrase-2026!')) {
              throw new Error('secret leaked from ' + path);
            }
          }
          const audit = await (await call(session, '/audit?limit=500')).json();
          const mutations = audit.events.filter(e => e.request_id && !e.operation.startsWith('GET '));
          if (!mutations.length || mutations.some(e => !['success','failure'].includes(e.result))) {
            throw new Error('administrative mutation audit is incomplete');
          }
          await pool.end();
          console.log(JSON.stringify({phase1:'ok', audited_mutations:mutations.length}));
          NODE
          if docker compose --env-file versions.env --env-file .env \
            logs admin-api admin-bootstrap | grep -F \
              -e 'known-ci-secret-must-never-leak' \
              -e 'Ci-Phase1-Strong-Passphrase-2026!'; then
            echo "::error::secret leaked to admin logs"
            exit 1
          fi
          if grep -R -F \
              -e 'known-ci-secret-must-never-leak' \
              -e 'Ci-Phase1-Strong-Passphrase-2026!' \
              admin-ui/public; then
              echo "::error::secret leaked to admin UI bundle"
              exit 1
          fi

      # Разделы, добавленные после первой фазы, до сих пор проверялись
      # только модульно. Здесь они работают на настоящей базе и настоящем
      # admin-api: важно не то, что функция вернула объект, а что
      # блокировка действительно легла в оба поля, что operator не получил
      # переписку и что её чтение осталось в журнале.
      - name: Admin users section — RBAC, blocking and conversation privacy
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T admin-api node --input-type=module - <<'NODE'
          import pg from 'pg';
          const base = 'http://127.0.0.1:8071/api/admin/v1';
          const password = 'Ci-Phase1-Strong-Passphrase-2026!';

          async function login(username = 'admin') {
            const response = await fetch(base + '/auth/login', {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({username, password}),
            });
            if (!response.ok) throw new Error('login failed for ' + username);
            const cookie = response.headers.getSetCookie()
              .map(v => v.split(';')[0]).join('; ');
            const csrf = /eva_admin_csrf=([^;]+)/.exec(cookie)?.[1];
            return {cookie, csrf: decodeURIComponent(csrf)};
          }
          async function call(session, path, options = {}) {
            const headers = {cookie: session.cookie, ...(options.headers || {})};
            if (options.body) headers['content-type'] = 'application/json';
            if (!['GET','HEAD'].includes(options.method || 'GET')) {
              headers['x-csrf-token'] = session.csrf;
            }
            return await fetch(base + path, {...options, headers});
          }
          async function sudo(session, scope) {
            const granted = await call(session, '/sudo', {
              method:'POST', body:JSON.stringify({password, scope}),
            });
            if (granted.status !== 201) throw new Error('sudo ' + scope + ' failed');
          }

          const pool = new pg.Pool({connectionString: process.env.DATABASE_URL});
          const seeded = await pool.query(
            `INSERT INTO users (telegram_id, username, first_name, state, is_blocked)
             VALUES (770001, 'ci_user', 'CI', 'active', false)
             ON CONFLICT (telegram_id) DO UPDATE
               SET state = 'active', is_blocked = false
             RETURNING id`);
          const userId = seeded.rows[0].id;

          const owner = await login();

          // Список и карточка доступны всем ролям, включая viewer.
          for (const role of ['owner','admin','operator','viewer']) {
            const session = role === 'owner' ? owner : await login('ci-' + role);
            for (const path of ['/users?limit=5', '/users/' + userId]) {
              const result = await call(session, path);
              if (!result.ok) throw new Error(role + ' cannot GET ' + path);
            }
            // Блокировать может только owner и admin, и только под sudo.
            const withoutSudo = await call(session, '/users/' + userId + '/block', {method:'POST'});
            if (withoutSudo.status !== 403) {
              throw new Error('block without sudo allowed for ' + role + ': ' + withoutSudo.status);
            }
            // Переписка — только owner и admin. Роль проверяется раньше
            // sudo, поэтому operator и viewer получают отказ и с грантом.
            if (['operator','viewer'].includes(role)) {
              const denied = await call(session, '/users/' + userId + '/conversation');
              if (denied.status !== 403) {
                throw new Error(role + ' reached the conversation: ' + denied.status);
              }
            }
          }

          // Блокировка выставляет оба признака: диалог останавливается по
          // любому из них, а фоновые рассылки требуют согласия обоих.
          await sudo(owner, 'users:write');
          const blocked = await call(owner, '/users/' + userId + '/block', {method:'POST'});
          if (!blocked.ok) throw new Error('block failed: ' + blocked.status);
          let row = (await pool.query(
            'SELECT state, is_blocked FROM users WHERE id = $1', [userId])).rows[0];
          if (row.state !== 'blocked' || row.is_blocked !== true) {
            throw new Error('block left the flags apart: ' + JSON.stringify(row));
          }

          const unblocked = await call(owner, '/users/' + userId + '/unblock', {method:'POST'});
          if (!unblocked.ok) throw new Error('unblock failed: ' + unblocked.status);
          row = (await pool.query(
            'SELECT state, is_blocked FROM users WHERE id = $1', [userId])).rows[0];
          if (row.state !== 'active' || row.is_blocked !== false) {
            throw new Error('unblock left the flags apart: ' + JSON.stringify(row));
          }

          // Состояние 'blocked' нельзя выставить правкой полей: иначе
          // появился бы второй способ блокировать, минуя sudo.
          const sneaky = await call(owner, '/users/' + userId, {
            method:'PATCH', body:JSON.stringify({state:'blocked'}),
          });
          if (sneaky.status !== 400) {
            throw new Error('state=blocked slipped through PATCH: ' + sneaky.status);
          }

          // Заметка идемпотентна по ключу: повтор не создаёт вторую.
          const key = 'ci-note-' + Date.now();
          for (let i = 0; i < 2; i += 1) {
            const noted = await call(owner, '/users/' + userId + '/notes', {
              method:'POST', headers:{'idempotency-key': key},
              body:JSON.stringify({note:'заметка приёмки'}),
            });
            if (!noted.ok) throw new Error('note failed: ' + noted.status);
          }
          const notes = await pool.query(
            'SELECT count(*)::int AS n FROM admin_user_notes WHERE idempotency_key = $1', [key]);
          if (notes.rows[0].n !== 1) {
            throw new Error('idempotency key produced ' + notes.rows[0].n + ' notes');
          }

          // Чтение переписки требует отдельного гранта.
          const noGrant = await call(owner, '/users/' + userId + '/conversation');
          if (noGrant.status !== 403) {
            throw new Error('conversation read without sudo: ' + noGrant.status);
          }
          await sudo(owner, 'users:messages');
          const conversation = await call(owner, '/users/' + userId + '/conversation?limit=20');
          if (!conversation.ok) throw new Error('conversation failed: ' + conversation.status);
          const payload = await conversation.json();
          if (!Array.isArray(payload.messages) || !Array.isArray(payload.highlights)) {
            throw new Error('conversation payload is malformed');
          }

          // Чтение переписки — безопасный метод, автоматический аудит его
          // пропускает, поэтому запись делается вручную. Проверяем, что она
          // есть и что текста в ней нет.
          const audited = await pool.query(
            `SELECT params_redacted_json::text AS params, message
               FROM audit_log
              WHERE operation = 'GET /api/admin/v1/users/:id/conversation'
              ORDER BY at DESC LIMIT 1`);
          if (!audited.rows.length) {
            throw new Error('conversation read was not audited');
          }
          const entry = audited.rows[0];
          if (!/user_id/.test(entry.params)) {
            throw new Error('audit entry does not name the user');
          }
          if (/привет|content|"text"/i.test(entry.params + ' ' + (entry.message ?? ''))) {
            throw new Error('conversation text reached the audit log');
          }

          // Карточка не должна отдавать прямую речь из кризисных событий.
          await pool.query(
            `INSERT INTO crisis_events (user_id, severity, trigger_text, response_text)
             VALUES ($1, 'low', 'CI-CRISIS-TRIGGER-TEXT', 'CI-CRISIS-RESPONSE-TEXT')`,
            [userId]);
          const card = await (await call(owner, '/users/' + userId)).text();
          if (card.includes('CI-CRISIS-TRIGGER-TEXT') || card.includes('CI-CRISIS-RESPONSE-TEXT')) {
            throw new Error('crisis text leaked into the user card');
          }

          await pool.end();
          console.log(JSON.stringify({users:'ok', user_id:userId}));
          NODE

      - name: VECTOR project skill is mounted where the Agent SDK session expects it
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T letta-app-server sh -c \
            'test -s /data/letta/.skills/vector-action/SKILL.md'

      - name: Public webhooks reject forged requests
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const base='http://127.0.0.1:8070';
              (async()=>{
                const forged=await fetch(base+'/telegram/webhook',{
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':'wrong'},
                  body:JSON.stringify({update_id:1}),
                });
