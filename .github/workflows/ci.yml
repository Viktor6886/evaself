                    if (body.stream) {
                      res.writeHead(200, {'Content-Type':'text/event-stream'});
                      res.write('data: ' + JSON.stringify({
                        id, object:'chat.completion.chunk', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
