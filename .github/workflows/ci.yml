          exit 1

      # Роутер до сих пор не запускался в CI ни разу: он есть в compose, но
      # ни один шаг его не поднимал, и вся отработка отказа держалась на
      # модульных тестах с подставными адаптерами. Здесь он работает
      # по-настоящему — с базой, живым провайдером и мёртвым портом.
      - name: LLM router fails over from a dead provider to a live one
        run: |
          docker compose --env-file versions.env --env-file .env up -d --build llm-router
          for i in $(seq 1 60); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-llm-router 2>/dev/null || echo down)"
            echo "llm-router, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ] && break
            [ "$i" = "60" ] && {
              docker compose --env-file versions.env --env-file .env logs --tail=100 llm-router
              exit 1
            }
            sleep 2
          done

          docker compose --env-file versions.env --env-file .env \
            exec -T llm-router node --input-type=module - <<'NODE'
          import pg from 'pg';
          import {SecretBox} from '/app/dist/llm.js';

          const pool = new pg.Pool({connectionString: process.env.DATABASE_URL});
          const box = new SecretBox(process.env.LLM_CONFIG_ENCRYPTION_KEY);
          const encrypted = box.encrypt('ci-provider-key');

          // Первый в цепочке слушает порт, на котором никого нет: соединение
          // отказывается сразу, без ожидания таймаута.
          async function provider(name, baseUrl) {
            // Уникальность имени задана индексом по lower(name), поэтому
            // ON CONFLICT выводится по тому же выражению.
            const {rows} = await pool.query(
              `INSERT INTO llm_providers
                 (name, protocol, base_url, model, context_window,
                  api_key_encrypted, enabled, priority)
               VALUES ($1, 'openai-compatible', $2, 'ci-model-b', 131072, $3, true, 1)
               ON CONFLICT (lower(name)) DO UPDATE
                 SET base_url = EXCLUDED.base_url,
                     context_window = EXCLUDED.context_window,
                     api_key_encrypted = EXCLUDED.api_key_encrypted,
                     enabled = true
               RETURNING id`, [name, baseUrl, encrypted]);
            return rows[0].id;
          }
          const dead = await provider('ci-dead', 'http://127.0.0.1:9');
          const live = await provider('ci-live', 'http://evaself-llm-mock:9000/v1');

          // Managed routing отправляет короткий `ping` в fast. Fixture
          // пишет БД напрямую (мимо admin API, который заполняет все
          // цепочки), поэтому обязан назначить и фактически выбранный
          // маршрут, иначе проверяется неполная конфигурация, а не failover.
          await pool.query(
            `DELETE FROM llm_route_providers
              WHERE route_code IN ('chat', 'fast')`);
          await pool.query(
            `INSERT INTO llm_route_providers (route_code, provider_id, position)
             VALUES ('chat', $1, 0), ('chat', $2, 1),
                    ('fast', $1, 0), ('fast', $2, 1)`, [dead, live]);
          // Предохранитель мог остаться разомкнутым от прошлых шагов.
          await pool.query('DELETE FROM llm_breaker_state');

          // /health уже прочитал провайдеров перед этой прямой вставкой.
          // В production изменения идут через API; fixture сознательно
          // обходит его, поэтому ждёт истечения короткого runtime-кэша.
          await new Promise((resolve) => setTimeout(resolve, 5_500));

          const before = (await pool.query('SELECT count(*)::int AS n FROM llm_requests')).rows[0].n;

          const response = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.EVA_ROUTER_API_KEY,
            },
            body: JSON.stringify({
              model: 'eva/chat',
              messages: [{role:'user', content:'ping'}],
            }),
          });
          if (!response.ok) {
            throw new Error('router returned ' + response.status + ': ' + await response.text());
          }
          const payload = await response.json();
          const content = payload.choices?.[0]?.message?.content;
          if (content !== 'CI chat ok') {
            throw new Error('unexpected content through the router: ' + JSON.stringify(content));
          }

          // Ответ сам по себе ничего не доказывает: он пришёл бы и если бы
          // мёртвого провайдера просто пропустили, не пытаясь. Телеметрия
          // хранит голову цепочки и того, кто ответил на самом деле, —
          // отработка отказа видна именно по их расхождению.
          const after = (await pool.query('SELECT count(*)::int AS n FROM llm_requests')).rows[0].n;
          if (after <= before) throw new Error('router wrote no telemetry');
          const {rows:[record]} = await pool.query(
            `SELECT primary_provider_id, actual_provider_id, switches,
                    switch_reason, succeeded, attempts
               FROM llm_requests
              WHERE route_code = 'fast'
              ORDER BY started_at DESC LIMIT 1`);
          if (!record.succeeded) throw new Error('router recorded a failed request');
          if (record.primary_provider_id !== dead) {
            throw new Error('the dead provider was not the head of the chain');
          }
          if (record.actual_provider_id !== live) {
            throw new Error('the answer did not come from the live provider');
          }
          // attempts относится к фактически ответившему провайдеру, а не
          // суммируется по всей цепочке. Само переключение подтверждают
          // switches и разные primary/actual provider выше.
          if (record.switches < 1 || record.attempts < 1) {
            throw new Error('no switch recorded: ' + JSON.stringify(record));
          }

          // Неизвестное имя модели остаётся разговорным запросом и проходит
          // через adaptive routing. Letta, переключённая на чужое имя, не
          // должна замолчать — независимо от выбранной цепочки.
          const unknown = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.EVA_ROUTER_API_KEY,
            },
            body: JSON.stringify({model:'eva/nope', messages:[{role:'user',content:'x'}]}),
          });
          if (!unknown.ok) {
            throw new Error('unknown model name should fall back to chat, got ' + unknown.status);
          }

          // Без ключа роутер не должен отвечать вовсе.
          const anonymous = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {'content-type':'application/json'},
            body: JSON.stringify({model:'eva/chat', messages:[{role:'user',content:'x'}]}),
          });
          if (anonymous.status !== 401 && anonymous.status !== 403) {
            throw new Error('router answered without a key: ' + anonymous.status);
          }

          await pool.end();
          console.log(JSON.stringify({
            router:'ok', switches:record.switches, reason:record.switch_reason,
          }));
          NODE

      - name: An agent and a conversation are created through the Agent SDK
        run: |
          set -e
