      - name: The updater socket is 0660 and only its group can reach it
        run: |
          # Сокет открывает фиксированные backup/update-команды, а у самого
          # eva-updater смонтирован Docker socket. Права 0666 давали доступ
          # любому процессу в любом контейнере, монтирующем этот volume.
          # Проверяются обе стороны: права сузились И клиент не потерялся.
          docker compose --env-file versions.env --env-file .env \
            up -d --build eva-updater
          for i in $(seq 1 30); do
            if docker compose --env-file versions.env --env-file .env \
                exec -T eva-updater test -S /run/evaself-updater/updater.sock; then
              break
            fi
            [ "$i" = "30" ] && {
              docker compose --env-file versions.env --env-file .env \
                logs --tail=50 eva-updater
              exit 1
            }
            sleep 2
          done

          PERMS="$(docker compose --env-file versions.env --env-file .env \
            exec -T eva-updater stat -c '%a %U:%G' /run/evaself-updater/updater.sock | tr -d '\r')"
          echo "updater socket: $PERMS"
          test "$PERMS" = "660 root:evaself-updater"

          # admin-api работает от node и обязан достучаться до сокета:
          # иначе ужесточение прав тихо сломало бы обновления.
          docker compose --env-file versions.env --env-file .env \
            exec -T admin-api node -e "
              const net = require('net');
              const s = net.connect('/run/evaself-updater/updater.sock');
              s.on('connect', () => { console.log('updater reachable from admin-api'); s.end(); });
              s.on('error', (e) => { console.error(e.message); process.exit(1); });
            " | grep -q 'updater reachable from admin-api'

      - name: SearXNG cannot reach PostgreSQL or the Caddy admin API
        run: |
          # Network segmentation, asserted rather than assumed: a container
          # that fetches untrusted external content must not see the data
          # tier. Probed with python (SearXNG is a python image) because
          # /dev/tcp is a bash builtin and this image ships busybox sh —
          # there the redirect always fails and the check would pass falsely.
          docker compose --env-file versions.env --env-file .env \
            exec -T searxng python3 -c "
          import socket, sys

          blocked = []
          for host, port in (('postgres', 5432), ('valkey', 6379), ('caddy', 2019)):
              try:
                  socket.create_connection((host, port), timeout=5).close()
              except OSError:
                  blocked.append(host)
                  continue
              print('::error::searxng can reach ' + host)
              sys.exit(1)
          print('searxng is isolated from: ' + ', '.join(blocked))
          " | tee /tmp/isolation
          grep -q 'isolated from: postgres, valkey, caddy' /tmp/isolation

