      - name: The updater socket is 0660 and only its group can reach it
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Сокет открывает фиксированные backup/update-команды, а у самого
          # eva-updater смонтирован Docker socket. Права 0666 давали доступ
          # любому процессу в любом контейнере, монтирующем этот volume.
          # Проверяются обе стороны: права сузились И клиент не потерялся.
          docker compose --env-file versions.env --env-file .env \
            up -d --build eva-updater
          for i in $(seq 1 30); do
            if docker compose --env-file versions.env --env-file .env \
                exec -T eva-updater test -S /run/evaself-updater/updater.sock; then
              break
            fi
            [ "$i" = "30" ] && {
              docker compose --env-file versions.env --env-file .env \
                logs --tail=50 eva-updater
              exit 1
            }
            sleep 2
          done

          PERMS="$(docker compose --env-file versions.env --env-file .env \
            exec -T eva-updater stat -c '%a %U:%G' /run/evaself-updater/updater.sock | tr -d '\r')"
          echo "updater socket: $PERMS"
          test "$PERMS" = "660 root:evaself-updater"

          # admin-api работает от node и обязан достучаться до сокета:
          # иначе ужесточение прав тихо сломало бы обновления.
          docker compose --env-file versions.env --env-file .env \
            exec -T admin-api node -e "
              const net = require('net');
              const s = net.connect('/run/evaself-updater/updater.sock');
              s.on('connect', () => { console.log('updater reachable from admin-api'); s.end(); });
              s.on('error', (e) => { console.error(e.message); process.exit(1); });
            " | grep -q 'updater reachable from admin-api'

      - name: SearXNG cannot reach PostgreSQL or the Caddy admin API
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Network segmentation, asserted rather than assumed: a container
          # that fetches untrusted external content must not see the data
          # tier. Probed with python (SearXNG is a python image) because
          # /dev/tcp is a bash builtin and this image ships busybox sh —
          # there the redirect always fails and the check would pass falsely.
          docker compose --env-file versions.env --env-file .env \
            exec -T searxng python3 -c "
          import socket, sys

          blocked = []
          for host, port in (('postgres', 5432), ('valkey', 6379), ('caddy', 2019)):
              try:
                  socket.create_connection((host, port), timeout=5).close()
              except OSError:
                  blocked.append(host)
                  continue
              print('::error::searxng can reach ' + host)
              sys.exit(1)
          print('searxng is isolated from: ' + ', '.join(blocked))
          " | tee /tmp/isolation
          grep -q 'isolated from: postgres, valkey, caddy' /tmp/isolation

      - name: Start an isolated OpenAI-compatible test provider
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker run -d --name evaself-llm-mock --network evaself-agent \
            node:22.22-bookworm-slim node -e "
              const http = require('http');
              const models = [{id:'ci-model-a',object:'model'},{id:'ci-model-b',object:'model'}];
              http.createServer((req,res) => {
                res.setHeader('Content-Type','application/json');
                if (req.url === '/v1/models') {
                  res.end(JSON.stringify({object:'list',data:models}));
                  return;
                }
                if (req.url === '/v1/chat/completions' && req.method === 'POST') {
                  let raw = '';
                  req.on('data', chunk => raw += chunk);
                  req.on('end', () => {
                    const body = JSON.parse(raw || '{}');
                    const id = 'chatcmpl-evaself-ci';
                    const messages = body.messages || [];
                    // Проба совместимости: настоящая разговорная модель
                    // обязана вызвать инструмент с аргументами по схеме,
                    // принять его результат и завершить цикл ответом.
                    // Отвечаем вызовом только на саму пробу, иначе
                    // обычный ход Евы получил бы вызов несуществующего
                    // инструмента.
                    const probing = (body.tools || []).some(
                      tool => (tool.function || {}).name === 'evaself_capability_probe');
                    const returning = messages.some(message => message.role === 'tool');
                    if (probing && !returning) {
                      res.end(JSON.stringify({
                        id, object:'chat.completion', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,message:{role:'assistant',content:null,tool_calls:[{
                          id:'call-ci-1', type:'function',
                          function:{name:'evaself_capability_probe', arguments:'{\"value\":\"ok\"}'},
                        }]},finish_reason:'tool_calls'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }));
                      return;
                    }
                    if ((body.response_format || {}).type === 'json_object') {
                      res.end(JSON.stringify({
                        id, object:'chat.completion', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,message:{role:'assistant',content:'{\"ok\":true}'},finish_reason:'stop'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }));
                      return;
                    }
                    if (body.stream) {
                      res.writeHead(200, {'Content-Type':'text/event-stream'});
                      res.write('data: ' + JSON.stringify({
                        id, object:'chat.completion.chunk', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,delta:{role:'assistant',content:'CI chat ok'},finish_reason:null}],
                      }) + '\n\n');
                      res.write('data: ' + JSON.stringify({
                        id, object:'chat.completion.chunk', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,delta:{},finish_reason:'stop'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }) + '\n\n');
                      res.end('data: [DONE]\n\n');
                    } else {
                      res.end(JSON.stringify({
                        id, object:'chat.completion', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,message:{role:'assistant',content:'CI chat ok'},finish_reason:'stop'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }));
                    }
                  });
                  return;
                }
                res.statusCode = 404;
                res.end(JSON.stringify({error:{message:'not found'}}));
              }).listen(9000,'0.0.0.0');
            "
          for i in $(seq 1 20); do
            docker compose --env-file versions.env --env-file .env \
              exec -T eva-agent-service node -e \
              "fetch('http://evaself-llm-mock:9000/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              && exit 0
            sleep 1
          done
          echo "::error::test LLM provider did not start"
          exit 1

      # Роутер до сих пор не запускался в CI ни разу: он есть в compose, но
      # ни один шаг его не поднимал, и вся отработка отказа держалась на
      # модульных тестах с подставными адаптерами. Здесь он работает
      # по-настоящему — с базой, живым провайдером и мёртвым портом.
      - name: LLM router fails over from a dead provider to a live one
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env up -d --build llm-router
          for i in $(seq 1 60); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-llm-router 2>/dev/null || echo down)"
            echo "llm-router, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ] && break
            [ "$i" = "60" ] && {
              docker compose --env-file versions.env --env-file .env logs --tail=100 llm-router
              exit 1
            }
            sleep 2
          done

          docker compose --env-file versions.env --env-file .env \
            exec -T llm-router node --input-type=module - <<'NODE'
          import pg from 'pg';
          import {SecretBox} from '/app/dist/llm.js';

          const pool = new pg.Pool({connectionString: process.env.DATABASE_URL});
          const box = new SecretBox(process.env.LLM_CONFIG_ENCRYPTION_KEY);
          const encrypted = box.encrypt('ci-provider-key');

          // Первый в цепочке слушает порт, на котором никого нет: соединение
          // отказывается сразу, без ожидания таймаута.
          async function provider(name, baseUrl) {
            // Уникальность имени задана индексом по lower(name), поэтому
            // ON CONFLICT выводится по тому же выражению.
            const {rows} = await pool.query(
              `INSERT INTO llm_providers
                 (name, protocol, base_url, model, context_window,
                  api_key_encrypted, enabled, priority)
               VALUES ($1, 'openai-compatible', $2, 'ci-model-b', 131072, $3, true, 1)
               ON CONFLICT (lower(name)) DO UPDATE
                 SET base_url = EXCLUDED.base_url,
                     context_window = EXCLUDED.context_window,
                     api_key_encrypted = EXCLUDED.api_key_encrypted,
                     enabled = true
               RETURNING id`, [name, baseUrl, encrypted]);
            return rows[0].id;
          }
          const dead = await provider('ci-dead', 'http://127.0.0.1:9');
          const live = await provider('ci-live', 'http://evaself-llm-mock:9000/v1');

          // Маршрут выводится детерминированно: `model: 'eva/chat'` — это
          // `chat`, и содержание сообщения на выбор не влияет. Прежде
          // короткий `ping` уходил в `fast`, потому что роутер разбирал
          // текст и решал, насколько глубоко думать; этого разбора больше
          // нет. Fixture пишет БД напрямую, мимо admin API, который
          // заполняет все цепочки, поэтому назначает обе — иначе
          // проверялась бы неполная конфигурация, а не отработка отказа.
          await pool.query(
            `DELETE FROM llm_route_providers
              WHERE route_code IN ('chat', 'fast')`);
          await pool.query(
            `INSERT INTO llm_route_providers (route_code, provider_id, position)
             VALUES ('chat', $1, 0), ('chat', $2, 1),
                    ('fast', $1, 0), ('fast', $2, 1)`, [dead, live]);
          // Предохранитель мог остаться разомкнутым от прошлых шагов.
          await pool.query('DELETE FROM llm_breaker_state');

          // /health уже прочитал провайдеров перед этой прямой вставкой.
          // В production изменения идут через API; fixture сознательно
          // обходит его, поэтому ждёт истечения короткого runtime-кэша.
          await new Promise((resolve) => setTimeout(resolve, 5_500));

          const before = (await pool.query('SELECT count(*)::int AS n FROM llm_requests')).rows[0].n;

          const response = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.EVA_ROUTER_API_KEY,
            },
            body: JSON.stringify({
              model: 'eva/chat',
              messages: [{role:'user', content:'ping'}],
            }),
          });
          if (!response.ok) {
            throw new Error('router returned ' + response.status + ': ' + await response.text());
          }
          const payload = await response.json();
          const content = payload.choices?.[0]?.message?.content;
          if (content !== 'CI chat ok') {
            throw new Error('unexpected content through the router: ' + JSON.stringify(content));
          }

          // Ответ сам по себе ничего не доказывает: он пришёл бы и если бы
          // мёртвого провайдера просто пропустили, не пытаясь. Телеметрия
          // хранит голову цепочки и того, кто ответил на самом деле, —
          // отработка отказа видна именно по их расхождению.
          const after = (await pool.query('SELECT count(*)::int AS n FROM llm_requests')).rows[0].n;
          if (after <= before) throw new Error('router wrote no telemetry');
          const {rows:[record]} = await pool.query(
            `SELECT primary_provider_id, actual_provider_id, switches,
                    switch_reason, succeeded, attempts
               FROM llm_requests
              WHERE route_code = 'chat'
              ORDER BY started_at DESC LIMIT 1`);
          if (!record) throw new Error('router wrote no telemetry for the chat route');
          if (!record.succeeded) throw new Error('router recorded a failed request');
          if (record.primary_provider_id !== dead) {
            throw new Error('the dead provider was not the head of the chain');
          }
          if (record.actual_provider_id !== live) {
            throw new Error('the answer did not come from the live provider');
          }
          // attempts относится к фактически ответившему провайдеру, а не
          // суммируется по всей цепочке. Само переключение подтверждают
          // switches и разные primary/actual provider выше.
          if (record.switches < 1 || record.attempts < 1) {
            throw new Error('no switch recorded: ' + JSON.stringify(record));
          }

          // Неизвестное имя модели остаётся разговорным запросом и проходит
          // через adaptive routing. Letta, переключённая на чужое имя, не
          // должна замолчать — независимо от выбранной цепочки.
          const unknown = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.EVA_ROUTER_API_KEY,
            },
            body: JSON.stringify({model:'eva/nope', messages:[{role:'user',content:'x'}]}),
          });
          if (!unknown.ok) {
            throw new Error('unknown model name should fall back to chat, got ' + unknown.status);
          }

          // Без ключа роутер не должен отвечать вовсе.
          const anonymous = await fetch('http://127.0.0.1:8073/chat/completions', {
            method: 'POST',
            headers: {'content-type':'application/json'},
            body: JSON.stringify({model:'eva/chat', messages:[{role:'user',content:'x'}]}),
          });
          if (anonymous.status !== 401 && anonymous.status !== 403) {
            throw new Error('router answered without a key: ' + anonymous.status);
          }

          await pool.end();
          console.log(JSON.stringify({
            router:'ok', switches:record.switches, reason:record.switch_reason,
          }));
          NODE

      - name: An agent and a conversation are created through the Agent SDK
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -e
          KEY="$(grep '^EVA_AGENT_API_KEY=' .env | cut -d= -f2)"
          RESULT="$(docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = '$KEY';
              fetch('http://127.0.0.1:8070/v1/users/ensure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
                body: JSON.stringify({ telegram_id: 424242, first_name: 'CI' }),
              }).then(r=>r.json()).then(b=>console.log(JSON.stringify(b)));
            " | tr -d '\r')"
          echo "$RESULT"
          echo "$RESULT" | grep -q '"agent_id"'
          echo "$RESULT" | grep -q '"conversation_id"'

      - name: WebUI API manages SDK settings, agents and conversations
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const base = 'http://127.0.0.1:8070';
              async function call(path, options = {}) {
                const response = await fetch(base + path, {
                  headers: {
                    'X-API-Key': key,
                    ...(options.body ? {'Content-Type': 'application/json'} : {}),
                  },
                  ...options,
                });
                const body = response.status === 204 ? null : await response.json();
                if (!response.ok) throw new Error(path + ': ' + JSON.stringify(body));
                return body;
              }
              (async () => {
                const settings = await call('/v1/sdk/settings');
                if (!settings.settings.app_server_auth_configured) {
                  throw new Error('App Server token presence is not reported');
                }
                const serialized = JSON.stringify(settings);
                if (serialized.includes(process.env.LETTA_APP_SERVER_TOKEN)) {
                  throw new Error('App Server token leaked through SDK settings');
                }
                const updated = await call('/v1/sdk/settings', {
                  method: 'PATCH',
                  body: JSON.stringify({
                    agent_name_prefix: 'ci-eva',
                    session_pool_size: 17,
                    permission_mode: 'standard',
                  }),
                });
                if (updated.settings.session_pool_size !== 17) {
                  throw new Error('SDK settings were not applied');
                }
                const created = await call('/v1/sdk/agents', {
                  method: 'POST',
                  body: JSON.stringify({
                    name: 'ci-admin-agent',
                    description: 'Создано smoke test',
                    tags: ['evaself', 'ci-admin'],
                    permission_mode: 'standard',
                    create_conversation: true,
                  }),
                });
                const agentId = created.agent.id;
                const conversationId = created.conversation.id;
                const conversations = await call(
                  '/v1/sdk/agents/' + encodeURIComponent(agentId) + '/conversations',
                );
                if (!conversations.conversations.some((item) => item.id === conversationId)) {
                  throw new Error('created conversation is not listed');
                }
                await call('/v1/sdk/agents/' + encodeURIComponent(agentId), {
                  method: 'PATCH',
                  body: JSON.stringify({description: 'Изменено через WebUI API'}),
                });
                const bulk = await call('/v1/sdk/agents/bulk', {
                  method: 'POST',
                  body: JSON.stringify({
                    agent_ids: [agentId],
                    patch: {tags: ['evaself', 'ci-bulk']},
                  }),
                });
                if (bulk.count !== 1) throw new Error('bulk update failed');
                const exported = await call(
                  '/v1/sdk/agents/export?ids=' + encodeURIComponent(agentId),
                );
                if (exported.format !== 'evaself-agent-export' || exported.agents.length !== 1) {
                  throw new Error('agent export failed');
                }
                const imported = await call('/v1/sdk/agents/import', {
                  method: 'POST',
                  body: JSON.stringify({agents: exported.agents}),
                });
                if (imported.count !== 1 || !imported.imported[0].agent.id) {
                  throw new Error('agent import failed');
                }
                const importedId = imported.imported[0].agent.id;
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(importedId) +
                    '?confirm=' + encodeURIComponent(importedId),
                  {method: 'DELETE'},
                );
                await call('/v1/sdk/conversations/' + encodeURIComponent(conversationId), {
                  method: 'PATCH',
                  body: JSON.stringify({archived: true}),
                });
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(agentId) +
                    '?confirm=' + encodeURIComponent(agentId),
                  {method: 'DELETE'},
                );
                const listed = await call('/v1/sdk/agents');
                if (listed.agents.some((item) => item.id === agentId)) {
                  throw new Error('agent was not deleted');
                }
                const system = await call('/v1/system');
                if (!system.sdk_capabilities?.trace || system.runtime !== 'letta-agent-sdk') {
                  throw new Error('system capability report is wrong');
                }
                const audit = await call('/v1/audit?limit=100');
                if (!audit.events.some((item) => item.action === 'agent.bulk-update') ||
                    !audit.events.some((item) => item.action === 'agent.export') ||
                    !audit.events.some((item) => item.action === 'agent.import')) {
                  throw new Error('administrative audit is incomplete');
                }
                console.log(JSON.stringify({
                  settings_saved: true,
                  agent_created: true,
                  bulk_updated: true,
                  export_import: true,
                  audit_recorded: true,
                  conversation_archived: true,
                  agent_deleted: true,
                }));
              })().catch((error) => { console.error(error); process.exit(1); });
            " | tee /tmp/sdk-admin
          grep -q '"agent_deleted":true' /tmp/sdk-admin

      - name: The mapping is persisted in PostgreSQL
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" | tee /tmp/mapping
          grep -q 424242 /tmp/mapping
          cp /tmp/mapping /tmp/mapping-before-llm
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-before-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              test -s "$root/system/persona.md"
              test -s "$root/system/human.md"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-before-llm

      - name: Two LLM configurations can be tested and switched
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const base = 'http://127.0.0.1:8070';
              async function call(path, options = {}) {
                const response = await fetch(base + path, {
                  headers: {
                    'X-API-Key': key,
                    ...(options.body ? {'Content-Type': 'application/json'} : {}),
                  },
                  ...options,
                });
                const body = response.status === 204 ? null : await response.json();
                if (!response.ok) throw new Error(path + ': ' + JSON.stringify(body));
                return body;
              }
              async function create(name, model) {
                return (await call('/v1/llm/providers', {
                  method: 'POST',
                  body: JSON.stringify({
                    name, protocol: 'openai-compatible',
                    base_url: 'http://evaself-llm-mock:9000/v1',
                    api_key: 'ci-key-' + name,
                    // Промпту Евы — системный текст, персона, рамка, описания
                    // навыков и определения инструментов — нужно около 41 000
                    // токенов. Окно меньше означает молчаливое обрезание: до
                    // 0.30.28 движок так и делал, роняя память и персону.
                    model, context_window: 131072,
                    additional_parameters: {request_timeout_ms: 30000},
                  }),
                })).provider;
              }
              (async () => {
                const first = await create('CI provider A', 'ci-model-a');
                const second = await create('CI provider B', 'ci-model-b');
                const standalone = (await call('/v1/sdk/agents', {
                  method:'POST',
                  body:JSON.stringify({
                    name:'ci-model-switch-agent',
                    tags:['evaself','ci-switch'],
                    create_conversation:true,
                  }),
                })).agent;
                const tested = await call('/v1/llm/providers/' + first.id + '/test', {method:'POST'});
                if (!tested.result.models.some((m) => m.id === 'ci-model-a')) {
                  throw new Error('/models did not return ci-model-a');
                }
                await call('/v1/llm/providers/' + first.id + '/activate', {method:'POST'});
                const active = await call('/v1/llm/providers/' + second.id + '/activate', {method:'POST'});
                const listed = await call('/v1/llm/providers');
                const serialized = JSON.stringify(listed);
                if (serialized.includes('ci-key-') || serialized.includes('api_key_encrypted')) {
                  throw new Error('an API key leaked through the admin API');
                }
                if (!active.provider.is_active || active.provider.model_handle !== 'lmstudio/ci-model-b') {
                  throw new Error('second provider was not activated');
                }
                const switchedAgent = await call(
                  '/v1/sdk/agents/' + encodeURIComponent(standalone.id),
                );
                // До роутера агент указывал прямо на модель провайдера. Теперь
                // он всегда указывает на роутер, а модель выбирает цепочка
                // маршрута — в этом и был смысл варианта А. Проверка ниже
                // сверяет уже цепочку, а не имя модели у агента.
                if (switchedAgent.agent.model !== 'lmstudio/eva/chat') {
                  throw new Error(
                    'standalone WebUI agent should point at the router, got ' +
                    switchedAgent.agent.model);
                }
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(standalone.id) +
                    '?confirm=' + encodeURIComponent(standalone.id),
                  {method:'DELETE'},
                );
                console.log(JSON.stringify({
                  provider_ids: [first.id, second.id],
                  active: active.provider.model_handle,
                  models: tested.result.models.map((m) => m.id),
                  secret_hidden: true,
                  standalone_updated: true,
                }));
              })().catch((error) => { console.error(error); process.exit(1); });
            " | tee /tmp/llm-switch
          grep -q '"active":"lmstudio/ci-model-b"' /tmp/llm-switch
          grep -q '"secret_hidden":true' /tmp/llm-switch
          grep -q '"standalone_updated":true' /tmp/llm-switch

          # Активация через App Server обновляет только основную chat-цепочку.
          # Независимая fast-цепочка должна сохранить прежнюю голову.
          . scripts/lib.sh
          load_env
          CHAT_ACTIVE_HEADS="$(docker compose --env-file versions.env --env-file .env \
            exec -T -e PGPASSWORD="$EVA_DB_PASSWORD" postgres \
            psql -v ON_ERROR_STOP=1 -At -U "$EVA_DB_USER" -d "$EVA_DB_NAME" \
              -c "SELECT count(*)
                    FROM llm_route_providers rp
                    JOIN llm_providers p ON p.id = rp.provider_id
                   WHERE rp.route_code = 'chat'
                     AND rp.position = 0
                     AND p.is_active;")"
          FAST_ACTIVE_HEADS="$(docker compose --env-file versions.env --env-file .env \
            exec -T -e PGPASSWORD="$EVA_DB_PASSWORD" postgres \
            psql -v ON_ERROR_STOP=1 -At -U "$EVA_DB_USER" -d "$EVA_DB_NAME" \
              -c "SELECT count(*)
                    FROM llm_route_providers rp
                    JOIN llm_providers p ON p.id = rp.provider_id
                   WHERE rp.route_code = 'fast'
                     AND rp.position = 0
                     AND p.is_active;")"
          CONFIGURED_HEADS="$(docker compose --env-file versions.env --env-file .env \
            exec -T -e PGPASSWORD="$EVA_DB_PASSWORD" postgres \
            psql -v ON_ERROR_STOP=1 -At -U "$EVA_DB_USER" -d "$EVA_DB_NAME" \
              -c "SELECT count(*) FROM llm_route_providers WHERE position = 0;")"
          if [ "$CONFIGURED_HEADS" != "2" ]; then
            echo "::error::активация изменила число настроенных цепочек: $CONFIGURED_HEADS"
            exit 1
          fi
          if [ "$CHAT_ACTIVE_HEADS" != "1" ]; then
            echo "::error::активация не обновила chat-цепочку: $CHAT_ACTIVE_HEADS"
            exit 1
          fi
          if [ "$FAST_ACTIVE_HEADS" != "0" ]; then
            echo "::error::активация переписала независимую fast-цепочку: $FAST_ACTIVE_HEADS"
            exit 1
          fi
          echo "chat-цепочка обновлена, независимая fast-цепочка сохранена"

      - name: WebUI chat completes a real SDK turn through the test LLM
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          CONVERSATION_ID="$(cut -d'|' -f3 /tmp/mapping-before-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e CONVERSATION_ID="$CONVERSATION_ID" eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const conversationId = process.env.CONVERSATION_ID;
              fetch(
                'http://127.0.0.1:8070/v1/sdk/conversations/' +
                  encodeURIComponent(conversationId) + '/messages/stream',
                {
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-API-Key':key},
                  body:JSON.stringify({text:'Ответь коротко для smoke test'}),
                },
              ).then(async (response) => {
                const raw = await response.text();
                if (!response.ok) throw new Error(raw);
                const frame = raw.match(/event: result\r?\ndata: (.+)\r?\n\r?\n/);
                if (!frame) throw new Error('result SSE event is missing: ' + raw);
                const body = JSON.parse(frame[1]);
                if (!String(body.reply).includes('CI chat ok')) {
                  throw new Error('unexpected chat reply: ' + JSON.stringify(body));
                }
                if (!Array.isArray(body.trace) || body.trace.length === 0 ||
                    !body.conversationId || !body.agentId) {
                  throw new Error('SDK trace or identifiers are missing');
                }
                console.log(JSON.stringify({
                  conversation_id: conversationId,
                  reply: body.reply,
                  agent_id: body.agentId,
                  trace_events: body.trace.length,
                  streamed: raw.includes('event: delta'),
                }));
              }).catch((error) => { console.error(error); process.exit(1); });
            " 2>&1 | tee /tmp/sdk-chat
          grep -q '"reply":"CI chat ok"' /tmp/sdk-chat
          grep -q '"streamed":true' /tmp/sdk-chat

      - name: Готовность подтверждается фактами runtime, а не конфигурацией
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Проверка идёт сразу после настоящего хода — и только после
          # него: факты снимаются при открытии сессии, а создание агента
          # и conversation идёт управляющим путём и сессии не открывает.
          # До хода готовность честно отвечает «фактов ещё нет».
          # /ready отдаёт 200, когда MemFS, нативная память, навыки,
          # субагенты, продуктовые инструменты и сессия на месте.
          RESULT="$(docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              fetch('http://127.0.0.1:8070/ready')
                .then(async (response) => {
                  const body = await response.json();
                  console.log(JSON.stringify({
                    status: response.status, ready: body.ready, state: body.state,
                    observed_age_seconds: body.observed_age_seconds, stale: body.stale,
                    checks: body.checks,
                  }));
                })
                .catch((error) => { console.error(error); process.exit(1); });
            " | tr -d '\r')"
          echo "$RESULT"
          echo "$RESULT" | grep -q '"ready":true'
          # Наблюдаемое проверяется строго: рабочий каталог памяти агента,
          # живая сессия, модель, продуктовые инструменты, режим
          # разрешений и свежесть снимка.
          for check in product_tools memfs session model permission_mode facts_fresh; do
            echo "$RESULT" | grep -q "{\"name\":\"$check\",\"status\":\"ok\"" \
              || { echo "::error::проверка готовности $check не зелёная"; exit 1; }
          done
          # Состав серверных инструментов установленный транспорт не
          # называет, поэтому нативные возможности допускаются как
          # `not_reported`. Чего допускать нельзя — так это `failed`:
          # названный список без памяти, навыков или субагентов означает
          # урезанный runtime.
          # `if`, а не `&&`: под `set -e` неудачный grep в конце тела цикла
          # оборвал бы шаг сам по себе, и проверка молча не выполнилась бы.
          for check in native_memory native_skills native_subagents; do
            if echo "$RESULT" | grep -q "{\"name\":\"$check\",\"status\":\"failed\""; then
              echo "::error::нативная возможность $check отсутствует"
              exit 1
            fi
          done
          # Ход только что прошёл: снимок фактов обязан быть свежим.
          echo "$RESULT" | grep -q '"stale":false' \
            || { echo "::error::готовность отвечает по устаревшему снимку фактов"; exit 1; }

      - name: Agent, conversation and memory survive model switching
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" > /tmp/mapping-after-llm
          diff -u /tmp/mapping-before-llm /tmp/mapping-after-llm
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-after-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-after-llm
          diff -u /tmp/memory-before-llm /tmp/memory-after-llm

      - name: LLM settings and mappings survive service restarts
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker compose --env-file versions.env --env-file .env \
            restart letta-app-server eva-agent-service
          for i in $(seq 1 60); do
            STATUS="$(
              (docker compose --env-file versions.env --env-file .env \
                exec -T eva-agent-service node -e "
                  fetch('http://127.0.0.1:8070/health')
                    .then(r=>r.json()).then(b=>console.log(b.status))
                    .catch(()=>console.log('down'))" 2>/dev/null || echo down) \
                | tr -d '\r'
            )"
            [ "$STATUS" = "ok" ] && break
            [ "$i" = "60" ] && exit 1
            sleep 3
          done
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              Promise.all([
                fetch('http://127.0.0.1:8070/v1/llm/providers',{headers:{'X-API-Key':key}}).then(r=>r.json()),
                fetch('http://127.0.0.1:8070/v1/agents',{headers:{'X-API-Key':key}}).then(r=>r.json()),
                fetch('http://127.0.0.1:8070/v1/sdk/settings',{headers:{'X-API-Key':key}}).then(r=>r.json()),
            ]).then(([llm,agents,sdk]) => {
              const active = llm.providers.find((p) => p.is_active);
              const expectedProviders = ['CI provider A', 'CI provider B'];
              if (!expectedProviders.every((name) => llm.providers.some((p) => p.name === name)) ||
                  active?.model_handle !== 'lmstudio/ci-model-b') {
                throw new Error('LLM provider state did not persist: ' + JSON.stringify(llm));
              }
              const agent = agents.agents.find((a) => String(a.telegram_id) === '424242');
              if (!agent?.agent_id || !agent?.conversation_id) {
                throw new Error('agent mapping did not persist: ' + JSON.stringify(agents));
              }
              if (sdk.settings?.session_pool_size !== 17 || sdk.settings?.agent_name_prefix !== 'ci-eva') {
                throw new Error('SDK settings did not persist: ' + JSON.stringify(sdk));
              }
              console.log(JSON.stringify({providers:llm.providers.length,configured_providers_persisted:true,active:active.model_handle,agent_id:agent.agent_id,conversation_id:agent.conversation_id,sdk_persisted:true}));
            }).catch((error) => { console.error(error); process.exit(1); });
          " | tee /tmp/restart-state
          grep -q '"configured_providers_persisted":true' /tmp/restart-state
          grep -q '"sdk_persisted":true' /tmp/restart-state
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" > /tmp/mapping-after-restart
          diff -u /tmp/mapping-before-llm /tmp/mapping-after-restart
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-after-restart)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-after-restart
          diff -u /tmp/memory-before-llm /tmp/memory-after-restart

      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file versions.env --env-file .env logs --tail=120 || true

      # Ход, остановленный подтверждением инструмента, выглядит как молчание:
      # ответа нет, ошибки нет. Пока причина не названа, разбор идёт вслепую
      # по чужим логам — так и искалась поломка обновления Agent SDK.
      # Шаг стоит последним намеренно: его ответ не должен смывать дампом.
      - name: Чего ждал ход
        if: failure()
        run: |
          . scripts/lib.sh
          load_env
          echo "--- ожидавшие подтверждения инструменты:"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e PGPASSWORD="$EVA_DB_PASSWORD" postgres \
            psql -At -U "$EVA_DB_USER" -d "$EVA_DB_NAME" \
              -c "SELECT created_at, status, tool_name, risk, action_description
                    FROM tool_approvals ORDER BY created_at DESC LIMIT 10" 2>&1 || true
          # Строка о подтверждении рождается до перезапуска сервиса, а
          # `compose logs` показывает только текущий контейнер. Поэтому
          # отбираем её по смыслу из всего, что есть, и лишь потом берём
          # общий хвост.
          echo "--- остановки хода подтверждением:"
          docker compose --env-file versions.env --env-file .env \
            logs eva-agent-service 2>&1 | grep -i 'подтвержд' | tail -10 || true
          # Таймаут хода объявляет app-server, а не сервис Евы: в прошлый
          # раз в диагностике были записи только сервиса, и причина
          # молчания осталась за кадром. Смотрим того, кто и таймаутит.
          echo "--- app-server, отказы и таймауты:"
          docker compose --env-file versions.env --env-file .env \
            logs letta-app-server 2>&1 \
            | grep -iE 'error|timed out|timeout|abort|context|token' | tail -25 || true
          echo "--- app-server, последнее:"
          docker compose --env-file versions.env --env-file .env \
            logs --tail=25 letta-app-server 2>&1 | tail -25 || true
          echo "--- последние записи агента:"
          docker compose --env-file versions.env --env-file .env \
            logs --tail=20 eva-agent-service 2>&1 | tail -20 || true
          # Ответ самого хода — последним и всегда. Вопрос «завис, ответил
          # не то или упал» решается одной этой строкой, а искать её среди
          # логов всех сервисов приходилось дольше, чем чинить причину.
          echo "--- что ответил ход:"
          tail -20 /tmp/sdk-chat 2>/dev/null || echo "(шаг чата не дошёл до ответа)"

      # Остановка контейнеров печатает под сотню строк и не объясняет
      # ничего: при разборе отказа она вытесняет из хвоста журнала именно
      # то, ради чего его читают. Поэтому молча.
      - name: Tear down
        if: always()
        run: |
          docker rm -f evaself-llm-mock >/dev/null 2>&1 || true
          docker compose --env-file versions.env --env-file .env down -v >/dev/null 2>&1 || true
