name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===================================================================
  # Shell, compose, Caddy, migrations, secret scan
  # ===================================================================
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and Caddy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          CADDY_VERSION="$(grep '^CADDY_VERSION=' versions.env | cut -d= -f2 | cut -d- -f1)"
          curl -fsSL -o /tmp/caddy.tgz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          sudo tar xzf /tmp/caddy.tgz -C /usr/local/bin caddy
          caddy version

      - name: Bash syntax
        run: |
          for f in scripts/*.sh backup-service/backup-service letta-app-server/entrypoint.sh; do
            bash -n "$f" || exit 1
          done

      - name: .env loader treats bcrypt and JSON as data
        run: |
          cat > /tmp/evaself-loader.env <<'EOF'
          LETTA_UI_PASSWORD_HASH='$2a$14$placeholderplaceholderpl'
          EVA_LLM_ADDITIONAL_PARAMETERS='{"request_timeout_ms":180000}'
          EOF
          ENV_FILE=/tmp/evaself-loader.env VERSIONS="$PWD/versions.env" bash -euo pipefail -c '
            . scripts/lib.sh
            load_env
            test "$LETTA_UI_PASSWORD_HASH" = "\$2a\$14\$placeholderplaceholderpl"
            test "$EVA_LLM_ADDITIONAL_PARAMETERS" = "{\"request_timeout_ms\":180000}"
          '

      - name: Installer defaults and skipped optional settings
        run: |
          ENV_FILE=/tmp/evaself-config.env \
          EVASELF_NONINTERACTIVE=1 \
          EVASELF_SKIP_PASSWORD_HASH=1 \
            ./scripts/configure.sh
          ENV_FILE=/tmp/evaself-config.env VERSIONS="$PWD/versions.env" bash -euo pipefail -c '
            . scripts/lib.sh
            load_env
            test "$DOMAIN" = "evaself.localhost"
            test "$DOMAIN_APP" = "app.evaself.localhost"
            test "$DOMAIN_NOCODB" = "nocodb.evaself.localhost"
            test -z "$EVA_TELEGRAM_BOT_TOKEN"
            test -z "$EVA_LLM_API_KEY"
            test "$EVA_LLM_ADDITIONAL_PARAMETERS" = "{\"request_timeout_ms\":180000}"
            [[ "$EVASELF_INCOMPLETE_SETTINGS" == *"Telegram Bot Token"* ]]
            [[ "$EVASELF_INCOMPLETE_SETTINGS" == *"LLM-провайдер"* ]]
            is_email "operator+alerts@example.com"
            ! is_email "operator@example"
          '

      - name: shellcheck
        run: shellcheck -S error -x scripts/*.sh backup-service/backup-service

      - name: Compose renders
        run: |
          sed 's/^\([A-Z0-9_]*\)=$/\1=placeholder/' .env.example > /tmp/ci.env
          docker compose --env-file versions.env --env-file /tmp/ci.env -f compose.yaml config -q
          echo "services: $(docker compose --env-file versions.env --env-file /tmp/ci.env -f compose.yaml config --services | wc -l)"

      - name: Caddyfiles validate
        env:
          DOMAIN: example.test
          DOMAIN_APP: app.example.test
          DOMAIN_API: api.example.test
          DOMAIN_NOCODB: admin.example.test
          DOMAIN_LETTA: letta.example.test
          DOMAIN_STATUS: status.example.test
          ACME_EMAIL: ops@example.test
          ACME_CA: https://acme-v02.api.letsencrypt.org/directory
          LETTA_UI_USER: admin
          LETTA_UI_PASSWORD_HASH: $2a$14$placeholderplaceholderpl
          EVA_AGENT_PORT: "8070"
          EVA_AGENT_URL: http://eva-agent-service:8070
          EVA_AGENT_API_KEY: placeholder
        run: |
          caddy validate --config Caddyfile
          caddy validate --config webapp/Caddyfile
          caddy validate --config letta-ui/Caddyfile

      - name: Validation works without Caddy installed on the host
        run: |
          sudo mv /usr/local/bin/caddy /usr/local/bin/caddy.disabled
          trap 'sudo mv /usr/local/bin/caddy.disabled /usr/local/bin/caddy' EXIT
          output="$(printf '%s\n' './scripts/validate.sh' 'echo stdin-preserved' | bash)"
          printf '%s\n' "$output"
          grep -q '^stdin-preserved$' <<<"$output"

      - name: Installer does not print generated passwords
        run: |
          if grep -Eq 'NocoDB.*NC_ADMIN_PASSWORD|Letta UI.*LETTA_UI_PASSWORD' scripts/install.sh; then
            echo "::error::installer summary exposes an administrative password"
            exit 1
          fi

      - name: Administrative WebUI JavaScript is valid
        run: node --check letta-ui/public/ui.js

      - name: No secrets in tracked files
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          if git grep -lIE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|[0-9]{8,}:AA[A-Za-z0-9_-]{30,})' \
               -- . ':(exclude)scripts/validate.sh' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::possible secret material in tracked files"; exit 1
          fi
          echo "clean"

  # ===================================================================
  # eva-agent-service: the Agent SDK integration
  # ===================================================================
  agent-service:
    name: eva-agent-service (TypeScript)
    runs-on: ubuntu-24.04
    env:
      EVA_PROFILE_COMPLETION_ENABLED: "true"
      EVA_VECTOR_GOALS_ENABLED: "true"
      EVA_GRAPH_MEMORY_ENABLED: "true"
      EVA_GRAPH_CONTEXT_TIMEOUT_MS: "75"
      EVA_PROFILE_CACHE_TTL_SECONDS: "60"
      EVA_CONVERSATION_MIRROR_ENABLED: "false"
      EVA_OUTBOX_ENABLED: "true"
    defaults:
      run:
        working-directory: eva-agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The Agent SDK requires >= 22.19.
          node-version: "22.22"
          cache: npm
          cache-dependency-path: eva-agent-service/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test --experimental-strip-types test/*.test.ts

      - name: The SDK is the official one, and it is actually used
        run: node ../scripts/verify-agent-sdk.mjs .

  # ===================================================================
  # PostgreSQL schema: applied for real, three times, to prove idempotency
  # ===================================================================
  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: eva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: ci
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: eva
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Extensions
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Apply migrations three times (must be idempotent)
        run: |
          for pass in 1 2 3; do
            echo "== migration pass $pass"
            for f in postgres/migrations/*.sql; do
              echo "== $f"
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      - name: The schema is what the services expect
        run: |
          psql -v ON_ERROR_STOP=1 -tA <<'SQL'
          DO $$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(t, ', ') INTO missing
            FROM unnest(ARRAY[
              'users','agent_links','agent_conversations','subscriptions','payments',
              'quotas','usage_counters','onboarding_fields','test_results','tasks',
              'referrals','partner_analysis_links','notifications','crisis_events',
              'schema_migrations','llm_providers','sdk_settings','telegram_updates',
              'telegram_outbox','timezone_aliases','profile_field_definitions',
              'user_preferences','eva_notes','budget_entries','heartbeat_state',
              'payment_intents','admin_audit_log','user_north','goals',
              'goal_results','goal_dependencies','work_blocks','goal_reviews',
              'goal_recommendations','user_strategies','learning_attempts',
              'memory_nodes','memory_edges','conversation_highlights'
            ]) AS t
            WHERE to_regclass('public.' || t) IS NULL;
            IF missing IS NOT NULL THEN RAISE EXCEPTION 'missing tables: %', missing; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'agent_links' AND column_name = 'conversation_id'
            ) THEN RAISE EXCEPTION 'agent_links.conversation_id is missing'; END IF;

            IF to_regclass('public.v_agent_runtime') IS NULL THEN
              RAISE EXCEPTION 'v_agent_runtime is missing';
            END IF;
          END $$;
          SQL
          echo "schema verified"

      - name: Seed data is not duplicated by a re-run
        run: |
          COUNT="$(psql -tA -c 'SELECT count(*) FROM quotas')"
          [ "$COUNT" = "12" ] || { echo "::error::quotas has $COUNT rows, expected 12"; exit 1; }

  # ===================================================================
  # media-service
  # ===================================================================
  media-service:
    name: media-service (Python + ffmpeg)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: media-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install --quiet -r requirements.txt pytest

      - name: Tests (real ffmpeg round-trips)
        env:
          MEDIA_WORK_DIR: /tmp/media
        run: python -m pytest -q

  # ===================================================================
  # Images build (and, for the agent service, its tests run in-build)
  # ===================================================================
  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build every locally built image
        run: |
          set -e
          . ./versions.env
          docker build -t evaself/eva-agent-service:ci \
            --build-arg NODE_BASE_VERSION="$NODE_BASE_VERSION" eva-agent-service
          docker build -t evaself/letta-app-server:ci \
            --build-arg NODE_BASE_VERSION="$NODE_BASE_VERSION" \
            --build-arg LETTA_CODE_VERSION="$LETTA_CODE_VERSION" letta-app-server
          docker build -t evaself/media-service:ci \
            --build-arg PYTHON_BASE_VERSION="$PYTHON_BASE_VERSION" media-service
          docker build -t evaself/webapp:ci \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" --build-arg CADDY_VERSION="$CADDY_VERSION" webapp
          docker build -t evaself/letta-ui:ci \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" --build-arg CADDY_VERSION="$CADDY_VERSION" letta-ui
          docker build -t evaself/backup-service:ci \
            --build-arg POSTGRES_IMAGE="$POSTGRES_IMAGE" --build-arg POSTGRES_VERSION="$POSTGRES_VERSION" backup-service

      - name: The App Server image really serves the App Server
        run: |
          docker run --rm evaself/letta-app-server:ci \
            sh -c 'letta server --help' | tee /tmp/help
          grep -q -- '--listen' /tmp/help

  # ===================================================================
  # The whole stack, started for real
  # ===================================================================
  stack:
    name: Stack smoke test
    runs-on: ubuntu-24.04
    needs: [agent-service, images]
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway .env
        run: |
          sed 's/^\([A-Z0-9_]*\)=$/\1=ci-placeholder/' .env.example > .env
          python3 - <<'PY'
          import re, secrets, pathlib
          path = pathlib.Path('.env')
          text = path.read_text()
          values = {
            'DOMAIN': 'example.test', 'DOMAIN_APP': 'app.example.test',
            'DOMAIN_API': 'api.example.test',
            'DOMAIN_NOCODB': 'admin.example.test', 'DOMAIN_LETTA': 'letta.example.test',
            'DOMAIN_STATUS': 'status.example.test', 'ACME_EMAIL': 'ci@example.test',
            'EVA_AGENT_PORT': '8070', 'LETTA_APP_SERVER_BACKEND': 'local',
            'EVA_TELEGRAM_API_BASE_URL': 'http://127.0.0.1:1',
            'EVA_LLM_PROVIDER_NAME': 'CI-bootstrap', 'EVA_LLM_MODEL': '',
            'EVA_LLM_CONTEXT_WINDOW': '32768',
            'COMPOSE_PROFILES': '',
          }
          for key, value in values.items():
            text = re.sub(rf'^{key}=.*$', f'{key}={value}', text, flags=re.M)
          for key in ('POSTGRES_SUPER_PASSWORD','EVA_DB_PASSWORD',
                      'NOCODB_DB_PASSWORD','LETTA_DB_PASSWORD','EVA_DB_READONLY_PASSWORD',
                      'VALKEY_PASSWORD','EVA_AGENT_API_KEY','LETTA_APP_SERVER_TOKEN',
                      'LLM_CONFIG_ENCRYPTION_KEY',
                      'NC_AUTH_JWT_SECRET','LAVA_WEBHOOK_PASSWORD',
                      'SEARXNG_SECRET','EVA_TELEGRAM_WEBHOOK_SECRET'):
            text = re.sub(rf'^{key}=.*$', f'{key}={secrets.token_hex(24)}', text, flags=re.M)
          path.write_text(text)
          PY
          chmod 600 .env

      - name: Start the data layer and apply migrations
        run: |
          docker compose --env-file versions.env --env-file .env \
            up -d postgres valkey
          for i in $(seq 1 60); do
            STATUS="$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              evaself-postgres 2>/dev/null || echo down)"
            echo "PostgreSQL, attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            [ "$i" = "60" ] && exit 1
            sleep 2
          done
          ./scripts/db-migrate.sh

      - name: Start the App Server and the agent service
        run: |
          docker compose --env-file versions.env --env-file .env \
            up -d --build letta-app-server eva-agent-service

      - name: Wait for the agent service to report healthy
        run: |
          for i in $(seq 1 60); do
            STATUS="$(docker compose --env-file versions.env --env-file .env \
              exec -T eva-agent-service node -e "
                fetch('http://127.0.0.1:8070/health')
                  .then(r=>r.json()).then(b=>console.log(b.status))
                  .catch(()=>console.log('down'))" 2>/dev/null | tr -d '\r')"
            echo "attempt $i: $STATUS"
            [ "$STATUS" = "ok" ] && exit 0
            sleep 5
          done
          echo "::error::eva-agent-service never became healthy"
          docker compose --env-file versions.env --env-file .env logs --tail=80 eva-agent-service letta-app-server
          exit 1

      - name: VECTOR project skill is mounted where the Agent SDK session expects it
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T letta-app-server sh -c \
            'test -s /data/letta/.skills/vector-action/SKILL.md'

      - name: Public webhooks reject forged requests
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const base='http://127.0.0.1:8070';
              (async()=>{
                const forged=await fetch(base+'/telegram/webhook',{
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':'wrong'},
                  body:JSON.stringify({update_id:1}),
                });
                if(forged.status!==401) throw new Error('forged Telegram status '+forged.status);
                const valid=await fetch(base+'/telegram/webhook',{
                  method:'POST',
                  headers:{
                    'Content-Type':'application/json',
                    'X-Telegram-Bot-Api-Secret-Token':process.env.EVA_TELEGRAM_WEBHOOK_SECRET,
                  },
                  body:JSON.stringify({
                    update_id:2,
                    message:{message_id:1,chat:{id:1},from:{id:1,is_bot:true}},
                  }),
                });
                if(valid.status!==200) throw new Error('valid Telegram status '+valid.status);
                const lava=await fetch(base+'/payments/lava',{
                  method:'POST',headers:{'Content-Type':'application/json'},body:'{}',
                });
                if(lava.status!==401) throw new Error('unauthorized Lava status '+lava.status);
                console.log('webhook auth ok');
              })().catch(e=>{console.error(e);process.exit(1)});
            "

      - name: Telegram inbox and outbox are durable
        run: |
          set -e
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              fetch('http://127.0.0.1:8070/telegram/webhook',{
                method:'POST',
                headers:{
                  'Content-Type':'application/json',
                  'X-Telegram-Bot-Api-Secret-Token':process.env.EVA_TELEGRAM_WEBHOOK_SECRET,
                },
                body:JSON.stringify({
                  update_id:2,
                  message:{message_id:1,chat:{id:1},from:{id:1,is_bot:true}},
                }),
              }).then(r=>{if(!r.ok)process.exit(1)});
            "
          for i in $(seq 1 20); do
            INBOX="$(docker compose --env-file versions.env --env-file .env \
              exec -T postgres psql -U eva -d eva -tAq -c \
              "SELECT status || '|' || (payload IS NOT NULL)::text || '|' || count(*) OVER ()
                 FROM telegram_updates WHERE update_id = 2" | tr -d '\r')"
            [ "$INBOX" = "ignored|true|1" ] && break
            [ "$i" = "20" ] && { echo "::error::durable inbox state: $INBOX"; exit 1; }
            sleep 1
          done

          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -U eva -d eva -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO telegram_outbox
               (idempotency_key, chat_id, telegram_method, payload)
             VALUES
               ('ci-outbox-retry', 1, 'sendMessage',
                '{\"chat_id\":1,\"text\":\"ci\"}'::jsonb)
             ON CONFLICT (idempotency_key) DO NOTHING"
          for i in $(seq 1 20); do
            OUTBOX="$(docker compose --env-file versions.env --env-file .env \
              exec -T postgres psql -U eva -d eva -tAq -c \
              "SELECT status || '|' || attempts
                 FROM telegram_outbox WHERE idempotency_key = 'ci-outbox-retry'" \
              | tr -d '\r')"
            case "$OUTBOX" in
              retry\|*|dead\|*) break ;;
            esac
            [ "$i" = "20" ] && { echo "::error::durable outbox state: $OUTBOX"; exit 1; }
            sleep 1
          done

      - name: Start an isolated OpenAI-compatible test provider
        run: |
          docker run -d --name evaself-llm-mock --network evaself-network \
            node:22.22-bookworm-slim node -e "
              const http = require('http');
              const models = [{id:'ci-model-a',object:'model'},{id:'ci-model-b',object:'model'}];
              http.createServer((req,res) => {
                res.setHeader('Content-Type','application/json');
                if (req.url === '/v1/models') {
                  res.end(JSON.stringify({object:'list',data:models}));
                  return;
                }
                if (req.url === '/v1/chat/completions' && req.method === 'POST') {
                  let raw = '';
                  req.on('data', chunk => raw += chunk);
                  req.on('end', () => {
                    const body = JSON.parse(raw || '{}');
                    const id = 'chatcmpl-evaself-ci';
                    if (body.stream) {
                      res.writeHead(200, {'Content-Type':'text/event-stream'});
                      res.write('data: ' + JSON.stringify({
                        id, object:'chat.completion.chunk', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,delta:{role:'assistant',content:'CI chat ok'},finish_reason:null}],
                      }) + '\n\n');
                      res.write('data: ' + JSON.stringify({
                        id, object:'chat.completion.chunk', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,delta:{},finish_reason:'stop'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }) + '\n\n');
                      res.end('data: [DONE]\n\n');
                    } else {
                      res.end(JSON.stringify({
                        id, object:'chat.completion', created:Math.floor(Date.now()/1000),
                        model:body.model || 'ci-model-b',
                        choices:[{index:0,message:{role:'assistant',content:'CI chat ok'},finish_reason:'stop'}],
                        usage:{prompt_tokens:10,completion_tokens:3,total_tokens:13},
                      }));
                    }
                  });
                  return;
                }
                res.statusCode = 404;
                res.end(JSON.stringify({error:{message:'not found'}}));
              }).listen(9000,'0.0.0.0');
            "
          for i in $(seq 1 20); do
            docker compose --env-file versions.env --env-file .env \
              exec -T eva-agent-service node -e \
              "fetch('http://evaself-llm-mock:9000/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              && exit 0
            sleep 1
          done
          echo "::error::test LLM provider did not start"
          exit 1

      - name: An agent and a conversation are created through the Agent SDK
        run: |
          set -e
          KEY="$(grep '^EVA_AGENT_API_KEY=' .env | cut -d= -f2)"
          RESULT="$(docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = '$KEY';
              fetch('http://127.0.0.1:8070/v1/users/ensure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
                body: JSON.stringify({ telegram_id: 424242, first_name: 'CI' }),
              }).then(r=>r.json()).then(b=>console.log(JSON.stringify(b)));
            " | tr -d '\r')"
          echo "$RESULT"
          echo "$RESULT" | grep -q '"agent_id"'
          echo "$RESULT" | grep -q '"conversation_id"'

      - name: WebUI API manages SDK settings, agents and conversations
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const base = 'http://127.0.0.1:8070';
              async function call(path, options = {}) {
                const response = await fetch(base + path, {
                  headers: {
                    'X-API-Key': key,
                    ...(options.body ? {'Content-Type': 'application/json'} : {}),
                  },
                  ...options,
                });
                const body = response.status === 204 ? null : await response.json();
                if (!response.ok) throw new Error(path + ': ' + JSON.stringify(body));
                return body;
              }
              (async () => {
                const settings = await call('/v1/sdk/settings');
                if (!settings.settings.app_server_auth_configured) {
                  throw new Error('App Server token presence is not reported');
                }
                const serialized = JSON.stringify(settings);
                if (serialized.includes(process.env.LETTA_APP_SERVER_TOKEN)) {
                  throw new Error('App Server token leaked through SDK settings');
                }
                const updated = await call('/v1/sdk/settings', {
                  method: 'PATCH',
                  body: JSON.stringify({
                    agent_name_prefix: 'ci-eva',
                    session_pool_size: 17,
                    permission_mode: 'standard',
                  }),
                });
                if (updated.settings.session_pool_size !== 17) {
                  throw new Error('SDK settings were not applied');
                }
                const created = await call('/v1/sdk/agents', {
                  method: 'POST',
                  body: JSON.stringify({
                    name: 'ci-admin-agent',
                    description: 'Создано smoke test',
                    tags: ['evaself', 'ci-admin'],
                    permission_mode: 'standard',
                    create_conversation: true,
                  }),
                });
                const agentId = created.agent.id;
                const conversationId = created.conversation.id;
                const conversations = await call(
                  '/v1/sdk/agents/' + encodeURIComponent(agentId) + '/conversations',
                );
                if (!conversations.conversations.some((item) => item.id === conversationId)) {
                  throw new Error('created conversation is not listed');
                }
                await call('/v1/sdk/agents/' + encodeURIComponent(agentId), {
                  method: 'PATCH',
                  body: JSON.stringify({description: 'Изменено через WebUI API'}),
                });
                const bulk = await call('/v1/sdk/agents/bulk', {
                  method: 'POST',
                  body: JSON.stringify({
                    agent_ids: [agentId],
                    patch: {tags: ['evaself', 'ci-bulk']},
                  }),
                });
                if (bulk.count !== 1) throw new Error('bulk update failed');
                const exported = await call(
                  '/v1/sdk/agents/export?ids=' + encodeURIComponent(agentId),
                );
                if (exported.format !== 'evaself-agent-export' || exported.agents.length !== 1) {
                  throw new Error('agent export failed');
                }
                const imported = await call('/v1/sdk/agents/import', {
                  method: 'POST',
                  body: JSON.stringify({agents: exported.agents}),
                });
                if (imported.count !== 1 || !imported.imported[0].agent.id) {
                  throw new Error('agent import failed');
                }
                const importedId = imported.imported[0].agent.id;
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(importedId) +
                    '?confirm=' + encodeURIComponent(importedId),
                  {method: 'DELETE'},
                );
                await call('/v1/sdk/conversations/' + encodeURIComponent(conversationId), {
                  method: 'PATCH',
                  body: JSON.stringify({archived: true}),
                });
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(agentId) +
                    '?confirm=' + encodeURIComponent(agentId),
                  {method: 'DELETE'},
                );
                const listed = await call('/v1/sdk/agents');
                if (listed.agents.some((item) => item.id === agentId)) {
                  throw new Error('agent was not deleted');
                }
                const system = await call('/v1/system');
                if (!system.sdk_capabilities?.trace || system.runtime !== 'letta-agent-sdk') {
                  throw new Error('system capability report is wrong');
                }
                const audit = await call('/v1/audit?limit=100');
                if (!audit.events.some((item) => item.action === 'agent.bulk-update') ||
                    !audit.events.some((item) => item.action === 'agent.export') ||
                    !audit.events.some((item) => item.action === 'agent.import')) {
                  throw new Error('administrative audit is incomplete');
                }
                console.log(JSON.stringify({
                  settings_saved: true,
                  agent_created: true,
                  bulk_updated: true,
                  export_import: true,
                  audit_recorded: true,
                  conversation_archived: true,
                  agent_deleted: true,
                }));
              })().catch((error) => { console.error(error); process.exit(1); });
            " | tee /tmp/sdk-admin
          grep -q '"agent_deleted":true' /tmp/sdk-admin

      - name: The mapping is persisted in PostgreSQL
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" | tee /tmp/mapping
          grep -q 424242 /tmp/mapping
          cp /tmp/mapping /tmp/mapping-before-llm
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-before-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              test -s "$root/system/persona.md"
              test -s "$root/system/human.md"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-before-llm

      - name: Two LLM configurations can be tested and switched
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const base = 'http://127.0.0.1:8070';
              async function call(path, options = {}) {
                const response = await fetch(base + path, {
                  headers: {
                    'X-API-Key': key,
                    ...(options.body ? {'Content-Type': 'application/json'} : {}),
                  },
                  ...options,
                });
                const body = response.status === 204 ? null : await response.json();
                if (!response.ok) throw new Error(path + ': ' + JSON.stringify(body));
                return body;
              }
              async function create(name, model) {
                return (await call('/v1/llm/providers', {
                  method: 'POST',
                  body: JSON.stringify({
                    name, protocol: 'openai-compatible',
                    base_url: 'http://evaself-llm-mock:9000/v1',
                    api_key: 'ci-key-' + name,
                    model, context_window: 32768,
                    additional_parameters: {request_timeout_ms: 30000},
                  }),
                })).provider;
              }
              (async () => {
                const first = await create('CI provider A', 'ci-model-a');
                const second = await create('CI provider B', 'ci-model-b');
                const standalone = (await call('/v1/sdk/agents', {
                  method:'POST',
                  body:JSON.stringify({
                    name:'ci-model-switch-agent',
                    tags:['evaself','ci-switch'],
                    create_conversation:true,
                  }),
                })).agent;
                const tested = await call('/v1/llm/providers/' + first.id + '/test', {method:'POST'});
                if (!tested.result.models.some((m) => m.id === 'ci-model-a')) {
                  throw new Error('/models did not return ci-model-a');
                }
                await call('/v1/llm/providers/' + first.id + '/activate', {method:'POST'});
                const active = await call('/v1/llm/providers/' + second.id + '/activate', {method:'POST'});
                const listed = await call('/v1/llm/providers');
                const serialized = JSON.stringify(listed);
                if (serialized.includes('ci-key-') || serialized.includes('api_key_encrypted')) {
                  throw new Error('an API key leaked through the admin API');
                }
                if (!active.provider.is_active || active.provider.model_handle !== 'lmstudio/ci-model-b') {
                  throw new Error('second provider was not activated');
                }
                const switchedAgent = await call(
                  '/v1/sdk/agents/' + encodeURIComponent(standalone.id),
                );
                if (switchedAgent.agent.model !== 'lmstudio/ci-model-b') {
                  throw new Error('standalone WebUI agent was not switched');
                }
                await call(
                  '/v1/sdk/agents/' + encodeURIComponent(standalone.id) +
                    '?confirm=' + encodeURIComponent(standalone.id),
                  {method:'DELETE'},
                );
                console.log(JSON.stringify({
                  provider_ids: [first.id, second.id],
                  active: active.provider.model_handle,
                  models: tested.result.models.map((m) => m.id),
                  secret_hidden: true,
                  standalone_updated: true,
                }));
              })().catch((error) => { console.error(error); process.exit(1); });
            " | tee /tmp/llm-switch
          grep -q '"active":"lmstudio/ci-model-b"' /tmp/llm-switch
          grep -q '"secret_hidden":true' /tmp/llm-switch
          grep -q '"standalone_updated":true' /tmp/llm-switch

      - name: WebUI chat completes a real SDK turn through the test LLM
        run: |
          CONVERSATION_ID="$(cut -d'|' -f3 /tmp/mapping-before-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e CONVERSATION_ID="$CONVERSATION_ID" eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              const conversationId = process.env.CONVERSATION_ID;
              fetch(
                'http://127.0.0.1:8070/v1/sdk/conversations/' +
                  encodeURIComponent(conversationId) + '/messages/stream',
                {
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-API-Key':key},
                  body:JSON.stringify({text:'Ответь коротко для smoke test'}),
                },
              ).then(async (response) => {
                const raw = await response.text();
                if (!response.ok) throw new Error(raw);
                const frame = raw.match(/event: result\r?\ndata: (.+)\r?\n\r?\n/);
                if (!frame) throw new Error('result SSE event is missing: ' + raw);
                const body = JSON.parse(frame[1]);
                if (!String(body.reply).includes('CI chat ok')) {
                  throw new Error('unexpected chat reply: ' + JSON.stringify(body));
                }
                if (!Array.isArray(body.trace) || body.trace.length === 0 ||
                    !body.conversationId || !body.agentId) {
                  throw new Error('SDK trace or identifiers are missing');
                }
                console.log(JSON.stringify({
                  conversation_id: conversationId,
                  reply: body.reply,
                  agent_id: body.agentId,
                  trace_events: body.trace.length,
                  streamed: raw.includes('event: delta'),
                }));
              }).catch((error) => { console.error(error); process.exit(1); });
            " | tee /tmp/sdk-chat
          grep -q '"reply":"CI chat ok"' /tmp/sdk-chat
          grep -q '"streamed":true' /tmp/sdk-chat

      - name: Agent, conversation and memory survive model switching
        run: |
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" > /tmp/mapping-after-llm
          diff -u /tmp/mapping-before-llm /tmp/mapping-after-llm
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-after-llm)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-after-llm
          diff -u /tmp/memory-before-llm /tmp/memory-after-llm

      - name: LLM settings and mappings survive service restarts
        run: |
          docker compose --env-file versions.env --env-file .env \
            restart letta-app-server eva-agent-service
          for i in $(seq 1 60); do
            STATUS="$(docker compose --env-file versions.env --env-file .env \
              exec -T eva-agent-service node -e "
                fetch('http://127.0.0.1:8070/health')
                  .then(r=>r.json()).then(b=>console.log(b.status))
                  .catch(()=>console.log('down'))" 2>/dev/null | tr -d '\r')"
            [ "$STATUS" = "ok" ] && break
            [ "$i" = "60" ] && exit 1
            sleep 3
          done
          docker compose --env-file versions.env --env-file .env \
            exec -T eva-agent-service node -e "
              const key = process.env.EVA_AGENT_API_KEY;
              Promise.all([
                fetch('http://127.0.0.1:8070/v1/llm/providers',{headers:{'X-API-Key':key}}).then(r=>r.json()),
                fetch('http://127.0.0.1:8070/v1/agents',{headers:{'X-API-Key':key}}).then(r=>r.json()),
                fetch('http://127.0.0.1:8070/v1/sdk/settings',{headers:{'X-API-Key':key}}).then(r=>r.json()),
              ]).then(([llm,agents,sdk]) => {
                const active = llm.providers.find((p) => p.is_active);
                if (llm.providers.length !== 2 || active?.model_handle !== 'lmstudio/ci-model-b') process.exit(1);
                const agent = agents.agents.find((a) => String(a.telegram_id) === '424242');
                if (!agent?.agent_id || !agent?.conversation_id) process.exit(1);
                if (sdk.settings?.session_pool_size !== 17 || sdk.settings?.agent_name_prefix !== 'ci-eva') process.exit(1);
                console.log(JSON.stringify({providers:llm.providers.length,active:active.model_handle,agent_id:agent.agent_id,conversation_id:agent.conversation_id,sdk_persisted:true}));
              }).catch(()=>process.exit(1));
            " | tee /tmp/restart-state
          grep -q '"providers":2' /tmp/restart-state
          grep -q '"sdk_persisted":true' /tmp/restart-state
          docker compose --env-file versions.env --env-file .env \
            exec -T postgres psql -tA -U postgres -d eva \
            -c "SELECT telegram_id, agent_id, conversation_id FROM v_agent_runtime" > /tmp/mapping-after-restart
          diff -u /tmp/mapping-before-llm /tmp/mapping-after-restart
          AGENT_ID="$(cut -d'|' -f2 /tmp/mapping-after-restart)"
          docker compose --env-file versions.env --env-file .env \
            exec -T -e AGENT_ID="$AGENT_ID" letta-app-server sh -c '
              root="/data/letta/lc-local-backend/memfs/$AGENT_ID/memory"
              find "$root" -type f ! -path "*/.git/*" -exec sha256sum "{}" \; | sort
            ' > /tmp/memory-after-restart
          diff -u /tmp/memory-before-llm /tmp/memory-after-restart

      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file versions.env --env-file .env logs --tail=200 || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f evaself-llm-mock 2>/dev/null || true
          docker compose --env-file versions.env --env-file .env down -v || true
