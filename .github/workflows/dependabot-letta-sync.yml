# =====================================================================
# Обновление Letta доезжает целиком, а не наполовину.
#
# Dependabot правит только `eva-agent-service/package.json`. Версия
# образа App Server живёт в `versions.env`, и обновление одного пакета
# оставляло клиент новее рантайма — разъехавшиеся версии одного
# протокола. Из-за этого групповой PR приходил заведомо красным и
# утаскивал за собой обычные обновления, которые иначе вливаются сами.
#
# Здесь недостающая половина дописывается в тот же pull request: версии
# выводятся из lock-файла тем же скриптом, что проверяет их в CI.
# Правило одно и то же, просто применённое, а не только проверенное.
#
# Что установленный SDK действительно умеет обещанное, доказывает не этот
# workflow, а contract-тест на живых объектах пакета. Он остаётся
# обязательной проверкой: если новая версия потеряет операцию из реестра,
# pull request останется красным и после выравнивания.
# =====================================================================
name: Dependabot Letta sync

on:
  pull_request:
    paths:
      - eva-agent-service/package-lock.json

permissions:
  contents: write

concurrency:
  group: dependabot-letta-sync-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    # Только для веток самого dependabot: в обычный pull request человека
    # workflow не должен дописывать коммиты за его спиной.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Прогон, запущенный pull request от Dependabot, GitHub считает
          # пришедшим извне: штатный GITHUB_TOKEN там read-only, а обычные
          # секреты Actions не видны вовсе. Поэтому дописать половину
          # обновления можно только своим токеном, и лежать он обязан в
          # хранилище секретов **Dependabot**, а не Actions:
          # Settings → Secrets and variables → Dependabot.
          #
          # DEPENDABOT_SYNC_TOKEN — тонкий PAT с правом contents:write на
          # этот репозиторий. Он же снимает вторую проблему: коммит от
          # штатного токена не запускает проверки заново, а коммит от PAT
          # запускает.
          token: ${{ secrets.DEPENDABOT_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Derive Letta versions from the lockfile
        id: sync
        run: python3 scripts/ci/sync-letta-versions.py --fix

      - name: Commit the other half of the update
        env:
          # Секрета нет — значит и права на пуш нет. Пробовать всё равно
          # значит уронить job и добавить к настоящей причине вторую,
          # мнимую. Молчать тоже нельзя: человек должен узнать, чего не
          # хватает, из самого прогона, а не из чужой памяти.
          HAS_TOKEN: ${{ secrets.DEPENDABOT_SYNC_TOKEN != '' }}
        run: |
          if git diff --quiet; then
            echo "версии уже согласованы — дописывать нечего"
            exit 0
          fi
          git --no-pager diff --stat
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Версии Letta разошлись с lock-файлом, но секрета"\
              "DEPENDABOT_SYNC_TOKEN нет, и права на пуш у этого прогона тоже."\
              "Выровняйте локально: python3 scripts/ci/sync-letta-versions.py --fix"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): выровнять версии Letta по lock-файлу"
          git push
