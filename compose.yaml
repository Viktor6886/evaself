# =====================================================================
# Evaself — full stack
# ---------------------------------------------------------------------
# Services are split across segmented internal bridge networks and
# address each other by container name. Only Caddy publishes ports on
# the host; PostgreSQL, Valkey, Letta, eva-agent-service, SearXNG, the media
# service and all background runtime internals are unreachable from the internet.
#
# Image tags come from versions.env, which is loaded by the Makefile and
# by every script (`--env-file versions.env --env-file .env`).
# =====================================================================

name: evaself

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Validates the tracked catalog and atomically stages only accepted files.
  # Letta cannot start until this one-shot owner has populated the shared SDK cwd.
  skill-indexer:
    <<: *logging
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    restart: "no"
    working_dir: /app
    command: ["node", "dist/skills/indexer-cli.js"]
    environment:
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
    volumes:
      - ./skills:/app/skills:ro
      - validated_skills:/data/letta/.skills
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  # ===================================================================
  # EDGE
  # ===================================================================
  caddy:
    <<: [*restart, *logging]
    image: ${CADDY_IMAGE}:${CADDY_VERSION}
    container_name: evaself-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_NOCODB: ${DOMAIN_NOCODB}
      DOMAIN_LETTA: ${DOMAIN_LETTA}
      DOMAIN_STATUS: ${DOMAIN_STATUS}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      LETTA_UI_USER: ${LETTA_UI_USER}
      LETTA_UI_PASSWORD_HASH: ${LETTA_UI_PASSWORD_HASH}
      EVA_AGENT_PORT: ${EVA_AGENT_PORT}
      # Used only by Caddy to inject the protected backend header.
      # It is never returned to the browser.
      EVA_AGENT_API_KEY: ${EVA_AGENT_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - webapp
      - eva-agent-service
      - admin-api
      - admin-ui
      - nocodb
      - letta-ui
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===================================================================
  # DATA LAYER (never published to the host)
  # ===================================================================
  postgres:
    <<: [*restart, *logging]
    image: ${POSTGRES_IMAGE}:${POSTGRES_VERSION}
    container_name: evaself-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: postgres
      # consumed by postgres/init/00-databases.sh
      EVA_DB_NAME: ${EVA_DB_NAME}
      EVA_DB_USER: ${EVA_DB_USER}
      EVA_DB_PASSWORD: ${EVA_DB_PASSWORD}
      EVA_DB_READONLY_USER: ${EVA_DB_READONLY_USER}
      EVA_DB_READONLY_PASSWORD: ${EVA_DB_READONLY_PASSWORD}
      NOCODB_DB_NAME: ${NOCODB_DB_NAME}
      NOCODB_DB_USER: ${NOCODB_DB_USER}
      NOCODB_DB_PASSWORD: ${NOCODB_DB_PASSWORD}
      LETTA_DB_NAME: ${LETTA_DB_NAME}
      LETTA_DB_USER: ${LETTA_DB_USER}
      LETTA_DB_PASSWORD: ${LETTA_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrations:/migrations:ro
    networks: [data]
    healthcheck:
      # Проверка идёт по TCP намеренно. Пока образ прогоняет скрипты
      # инициализации, внутри работает временный сервер, слушающий
      # ТОЛЬКО unix-сокет, — и `pg_isready` без адреса объявляет базу
      # здоровой посреди инициализации. Дальше сервер перезапускается,
      # и тот, кто поверил здоровью, теряет соединение на полпути:
      # ровно так падал смоук-стенд, когда миграций стало больше и
      # инициализация стала длиннее. По TCP временный сервер не
      # отвечает, поэтому «здоров» означает «готов принимать работу».
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPER_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  valkey:
    <<: [*restart, *logging]
    image: ${VALKEY_IMAGE}:${VALKEY_VERSION}
    container_name: evaself-valkey
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # ===================================================================
  # AGENT LAYER
  # ===================================================================
  letta-app-server:
    <<: [*restart, *logging]
    build:
      context: ./letta-app-server
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
        LETTA_CODE_VERSION: ${LETTA_CODE_VERSION}
    image: evaself/letta-app-server:${LETTA_CODE_VERSION}
    container_name: evaself-letta-app-server
    # The App Server speaks WebSocket, not REST, and is never published.
    # Its only client is eva-agent-service, through the Agent SDK.
    environment:
      LETTA_APP_SERVER_LISTEN: ws://0.0.0.0:4500
      LETTA_APP_SERVER_TOKEN: ${LETTA_APP_SERVER_TOKEN}
      LETTA_APP_SERVER_BACKEND: ${LETTA_APP_SERVER_BACKEND:-local}
      LETTA_HOME: /data/letta
      LETTA_LOCAL_BACKEND_DIR: /data/letta/lc-local-backend
      LETTA_LLM_RESTART_FILE: /data/llm-control/restart.request
      TZ: ${TZ}
    volumes:
      # Agents, conversations and the memory filesystem all live here.
      - letta_app_server_data:/data/letta
      # Конфигурация OpenAI-compatible провайдера записывается официальным
      # Letta CLI из eva-agent-service и читается локальным App Server.
      - letta_provider_config:/data/letta/lc-local-backend/providers
      - letta_llm_control:/data/llm-control
      # Exact Agent SDK project cwd, populated only by the validating indexer.
      - validated_skills:/data/letta/.skills:ro
      - ./library:/library:ro
    networks: [agent]
    depends_on:
      skill-indexer:
        condition: service_completed_successfully
    healthcheck:
      # The listener is a WebSocket upgrade endpoint; a TCP connect is the
      # honest liveness signal. eva-agent-service /health proves the
      # protocol works end to end.
      test: ["CMD-SHELL", "node -e \"require('net').connect(4500,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  letta-ui:
    <<: [*restart, *logging]
    build:
      context: ./letta-ui
      args:
        CADDY_IMAGE: ${CADDY_IMAGE}
        CADDY_VERSION: ${CADDY_VERSION}
    image: evaself/letta-ui:0.3.0
    container_name: evaself-letta-ui
    # The App Server is WebSocket-only, so the console cannot talk to it
    # from a browser. It goes through eva-agent-service.
    environment:
      EVA_AGENT_URL: http://eva-agent-service:${EVA_AGENT_PORT}
      EVA_AGENT_API_KEY: ${EVA_AGENT_API_KEY}
    networks: [edge]
    depends_on:
      eva-agent-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-ui:
    <<: [*restart, *logging]
    build:
      context: ./admin-ui
      args:
        CADDY_IMAGE: ${CADDY_IMAGE}
        CADDY_VERSION: ${CADDY_VERSION}
    image: evaself/admin-ui:0.1.0
    container_name: evaself-admin-ui
    networks: [edge]
    depends_on:
      admin-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  eva-agent-service:
    <<: [*restart, *logging]
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    container_name: evaself-eva-agent-service
    # The ONLY component that talks to the Letta App Server, and it does so
    # exclusively through @letta-ai/letta-agent-sdk.
    environment:
      EVA_AGENT_PORT: ${EVA_AGENT_PORT}
      EVA_AGENT_API_KEY: ${EVA_AGENT_API_KEY}
      EVA_AGENT_LOG_LEVEL: ${EVA_AGENT_LOG_LEVEL}
      EVA_AGENT_LOCK_TTL: ${EVA_AGENT_LOCK_TTL}
      EVA_AGENT_TURN_TIMEOUT_MS: ${EVA_AGENT_TURN_TIMEOUT_MS}
      DOMAIN: ${DOMAIN}
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_NOCODB: ${DOMAIN_NOCODB}
      DOMAIN_LETTA: ${DOMAIN_LETTA}
      DOMAIN_STATUS: ${DOMAIN_STATUS}
      EVASELF_INCOMPLETE_SETTINGS: ${EVASELF_INCOMPLETE_SETTINGS:-}
      EVA_AGENT_PERSONA_FILE: /app/library/persona/eva.md
      LETTA_APP_SERVER_URL: ws://letta-app-server:4500/ws
      LETTA_APP_SERVER_TOKEN: ${LETTA_APP_SERVER_TOKEN}
      LETTA_APP_SERVER_TIMEOUT_MS: ${LETTA_APP_SERVER_TIMEOUT_MS:-180000}
      EVA_LLM_PROVIDER_NAME: ${EVA_LLM_PROVIDER_NAME}
      EVA_LLM_PROTOCOL: ${EVA_LLM_PROTOCOL:-openai-compatible}
      EVA_LLM_BASE_URL: ${EVA_LLM_BASE_URL}
      EVA_LLM_API_KEY: ${EVA_LLM_API_KEY}
      EVA_LLM_MODEL: ${EVA_LLM_MODEL}
      EVA_LLM_CONTEXT_WINDOW: ${EVA_LLM_CONTEXT_WINDOW}
      EVA_LLM_ADDITIONAL_PARAMETERS: ${EVA_LLM_ADDITIONAL_PARAMETERS}
      EVA_LLM_PROBE_TIMEOUT_MS: ${EVA_LLM_PROBE_TIMEOUT_MS:-20000}
      # Активация провайдера перенастраивает App Server на роутер и кладёт
      # этот ключ в его окружение. Без него переключение LLM отказывает с
      # «EVA_ROUTER_API_KEY не задан», хотя ключ есть в .env: он просто
      # никогда не доходил до этого контейнера.
      EVA_ROUTER_URL: ${EVA_ROUTER_URL:-http://llm-router:8073}
      EVA_ROUTER_API_KEY: ${EVA_ROUTER_API_KEY}
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY}
      LETTA_PROVIDER_CONFIG_DIR: /data/letta-config
      LETTA_LLM_RESTART_FILE: /data/llm-control/restart.request
      LETTA_CODE_CLI: /app/node_modules/.bin/letta
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:${VALKEY_PORT}/1
      EVA_TELEGRAM_BOT_TOKEN: ${EVA_TELEGRAM_BOT_TOKEN}
      EVA_TELEGRAM_WEBHOOK_SECRET: ${EVA_TELEGRAM_WEBHOOK_SECRET}
      # Значение зажимается кодом в 300-600 с, поэтому старое 3600 в .env
      # существующей установки поверхность не расширяет.
      EVA_TELEGRAM_WEBAPP_MAX_AGE_SECONDS: ${EVA_TELEGRAM_WEBAPP_MAX_AGE_SECONDS:-600}
      EVA_WEBAPP_SESSION_TTL_SECONDS: ${EVA_WEBAPP_SESSION_TTL_SECONDS:-900}
      EVA_RATE_LIMIT_WINDOW_SECONDS: ${EVA_RATE_LIMIT_WINDOW_SECONDS:-60}
      EVA_PUBLIC_RATE_LIMIT_PER_IP: ${EVA_PUBLIC_RATE_LIMIT_PER_IP:-120}
      EVA_PUBLIC_RATE_LIMIT_PER_USER: ${EVA_PUBLIC_RATE_LIMIT_PER_USER:-60}
      EVA_WEBHOOK_RATE_LIMIT_PER_IP: ${EVA_WEBHOOK_RATE_LIMIT_PER_IP:-600}
      EVA_HEALTH_RATE_LIMIT_PER_IP: ${EVA_HEALTH_RATE_LIMIT_PER_IP:-300}
      EVA_TELEGRAM_INBOX_POLL_MS: ${EVA_TELEGRAM_INBOX_POLL_MS:-500}
      EVA_TELEGRAM_INBOX_LEASE_SECONDS: ${EVA_TELEGRAM_INBOX_LEASE_SECONDS:-300}
      EVA_TELEGRAM_INBOX_MAX_ATTEMPTS: ${EVA_TELEGRAM_INBOX_MAX_ATTEMPTS:-5}
      EVA_TELEGRAM_OUTBOX_POLL_MS: ${EVA_TELEGRAM_OUTBOX_POLL_MS:-500}
      EVA_TELEGRAM_OUTBOX_LEASE_SECONDS: ${EVA_TELEGRAM_OUTBOX_LEASE_SECONDS:-120}
      EVA_TELEGRAM_OUTBOX_MAX_ATTEMPTS: ${EVA_TELEGRAM_OUTBOX_MAX_ATTEMPTS:-8}
      EVA_PARALLEL_OUTBOX: ${EVA_PARALLEL_OUTBOX:-false}
      EVA_OUTBOX_CONCURRENCY: ${EVA_OUTBOX_CONCURRENCY:-8}
      EVA_OUTBOX_BATCH_SIZE: ${EVA_OUTBOX_BATCH_SIZE:-16}
      EVA_TELEGRAM_GLOBAL_RATE: ${EVA_TELEGRAM_GLOBAL_RATE:-25}
      EVA_TELEGRAM_GLOBAL_BURST: ${EVA_TELEGRAM_GLOBAL_BURST:-25}
      EVA_TELEGRAM_CHAT_RATE: ${EVA_TELEGRAM_CHAT_RATE:-1}
      EVA_TELEGRAM_CHAT_BURST: ${EVA_TELEGRAM_CHAT_BURST:-1}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID}
      EVA_TELEGRAM_API_BASE_URL: ${EVA_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      EVA_MEDIA_SERVICE_URL: http://media-service:8090
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      SEARXNG_BASE_URL: http://searxng:8080/
      CRAWL4AI_BASE_URL: ${CRAWL4AI_BASE_URL:-http://crawl4ai:11235/}
      TODOIST_API_URL: ${TODOIST_API_URL:-https://api.todoist.com/api/v1}
      TODOIST_API_TOKEN: ${TODOIST_API_TOKEN:-}
      TODOIST_PROJECT_ID: ${TODOIST_PROJECT_ID:-}
      EVA_SCHEDULER_INTERVAL_MS: ${EVA_SCHEDULER_INTERVAL_MS:-30000}
      EVA_HEARTBEAT_INTERVAL_MS: ${EVA_HEARTBEAT_INTERVAL_MS:-600000}
      EVA_TELEGRAM_TYPING_INTERVAL_MS: ${EVA_TELEGRAM_TYPING_INTERVAL_MS:-4000}
      EVA_PROFILE_COMPLETION_ENABLED: ${EVA_PROFILE_COMPLETION_ENABLED:-true}
      EVA_VECTOR_GOALS_ENABLED: ${EVA_VECTOR_GOALS_ENABLED:-true}
      EVA_GRAPH_MEMORY_ENABLED: ${EVA_GRAPH_MEMORY_ENABLED:-true}
      EVA_GRAPH_CONTEXT_TIMEOUT_MS: ${EVA_GRAPH_CONTEXT_TIMEOUT_MS:-75}
      EVA_PROFILE_CACHE_TTL_SECONDS: ${EVA_PROFILE_CACHE_TTL_SECONDS:-60}
      EVA_CONVERSATION_MIRROR_ENABLED: ${EVA_CONVERSATION_MIRROR_ENABLED:-false}
      EVA_OUTBOX_ENABLED: ${EVA_OUTBOX_ENABLED:-true}
      EVA_TURN_LIFECYCLE: ${EVA_TURN_LIFECYCLE:-false}
      EVA_PARALLEL_INBOX: ${EVA_PARALLEL_INBOX:-false}
      EVA_TURN_AGGREGATION: ${EVA_TURN_AGGREGATION:-false}
      EVA_INBOX_CONCURRENCY: ${EVA_INBOX_CONCURRENCY:-8}
      EVA_INBOX_BATCH_SIZE: ${EVA_INBOX_BATCH_SIZE:-16}
      EVA_TURN_SLOTS_TOTAL: ${EVA_TURN_SLOTS_TOTAL:-128}
      EVA_TURN_AGGREGATION_DEBOUNCE_MS: ${EVA_TURN_AGGREGATION_DEBOUNCE_MS:-800}
      EVA_TURN_AGGREGATION_WINDOW_MS: ${EVA_TURN_AGGREGATION_WINDOW_MS:-2500}
      EVA_SAFE_SESSION_MANAGER: ${EVA_SAFE_SESSION_MANAGER:-false}
      EVA_SESSION_DRAIN_MS: ${EVA_SESSION_DRAIN_MS:-8000}
      EVA_TURN_RECOVERY: ${EVA_TURN_RECOVERY:-false}
      EVA_TURN_RECOVERY_INTERVAL_MS: ${EVA_TURN_RECOVERY_INTERVAL_MS:-30000}
      EVA_SHUTDOWN_DRAIN_MS: ${EVA_SHUTDOWN_DRAIN_MS:-8000}
      EVA_BULLMQ_JOBS: ${EVA_BULLMQ_JOBS:-false}
      EVA_JOBS_OUTBOX_POLL_MS: ${EVA_JOBS_OUTBOX_POLL_MS:-1000}
      EVA_JOBS_OUTBOX_BATCH: ${EVA_JOBS_OUTBOX_BATCH:-32}
      EVA_BULLMQ_MAINTENANCE: ${EVA_BULLMQ_MAINTENANCE:-false}
      EVA_BULLMQ_PROACTIVE: ${EVA_BULLMQ_PROACTIVE:-false}
      EVA_JOBS_MIRROR: ${EVA_JOBS_MIRROR:-true}
      EVA_AGENT_JOBS: ${EVA_AGENT_JOBS:-false}
      EVA_SUBAGENTS: ${EVA_SUBAGENTS:-false}
      EVA_REFLECTION_SUBAGENT: ${EVA_REFLECTION_SUBAGENT:-false}
      EVA_LANGCHAIN: ${EVA_LANGCHAIN:-false}
      EVA_RESEARCH_ORCHESTRATOR: ${EVA_RESEARCH_ORCHESTRATOR:-false}
      EVA_LETTA_SDK_060: ${EVA_LETTA_SDK_060:-false}
      EVA_TOOL_GATEWAY: ${EVA_TOOL_GATEWAY:-false}
      EVA_TOOL_APPROVALS: ${EVA_TOOL_APPROVALS:-false}
      EVA_TEMPORAL_MEMORY: ${EVA_TEMPORAL_MEMORY:-false}
      EVA_MEMORY_CURATOR: ${EVA_MEMORY_CURATOR:-false}
      EVA_MEMORY_DOCTOR: ${EVA_MEMORY_DOCTOR:-false}
      EVA_HYBRID_RETRIEVAL: ${EVA_HYBRID_RETRIEVAL:-false}
      EVA_DEEP_RECALL: ${EVA_DEEP_RECALL:-false}
      EVA_CORE_SKILLS: ${EVA_CORE_SKILLS:-false}
      EVA_SKILL_ROUTER: ${EVA_SKILL_ROUTER:-false}
      EVA_MINIAPP_JOURNAL_V2: ${EVA_MINIAPP_JOURNAL_V2:-false}
      EVA_JOURNAL_VOICE_RETENTION_DAYS: ${EVA_JOURNAL_VOICE_RETENTION_DAYS:-30}
      EVA_LETTA_ADMIN_CLIENT: ${EVA_LETTA_ADMIN_CLIENT:-false}
      EVA_LETTA_ADMIN_BASE_URL: ${EVA_LETTA_ADMIN_BASE_URL:-}
      EVA_CHECKIN_MORNING_HOUR: ${EVA_CHECKIN_MORNING_HOUR:-9}
      EVA_CHECKIN_EVENING_HOUR: ${EVA_CHECKIN_EVENING_HOUR:-21}
      EVA_OTEL: ${EVA_OTEL:-false}
      EVA_PROMETHEUS: ${EVA_PROMETHEUS:-true}
      EVA_LANGFUSE_METADATA_ONLY: ${EVA_LANGFUSE_METADATA_ONLY:-false}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      EVA_TELEMETRY_PSEUDONYM_SECRET: ${EVA_TELEMETRY_PSEUDONYM_SECRET:-}
      EVA_RETENTION_ENFORCEMENT: ${EVA_RETENTION_ENFORCEMENT:-false}
      LAVA_WEBHOOK_USER: ${LAVA_WEBHOOK_USER:-eva}
      LAVA_WEBHOOK_PASSWORD: ${LAVA_WEBHOOK_PASSWORD:-}
      LAVA_PLANS_JSON: ${LAVA_PLANS_JSON:-}
      TZ: ${TZ}
    volumes:
      - ./library:/app/library:ro
      - ./skills:/app/skills:ro
      # The long-running config subscriber is the single update writer.
      - validated_skills:/data/letta/.skills
      - letta_provider_config:/data/letta-config/providers
      - letta_llm_control:/data/llm-control
    networks: [edge, data, agent, tools]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      letta-app-server:
        condition: service_started
      # Через роутер идёт каждый ход Евы, поэтому он должен стартовать
      # раньше. Именно service_started, а не service_healthy: нездоровый
      # роутер иначе не дал бы агенту подняться вообще, превратив
      # частичный отказ в полный.
      llm-router:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.EVA_AGENT_PORT||8070)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Одноразовый идемпотентный импорт существующей конфигурации. Только этот
  # init-контейнер видит legacy-переменные из .env; основной admin-api — нет.
  admin-bootstrap:
    <<: *logging
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    container_name: evaself-admin-bootstrap
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
      EVA_SECRETS_MASTER_KEY_FILE: /run/secrets/eva-secrets-master-key
      EVA_ADMIN_USERNAME: ${EVA_ADMIN_USERNAME:-admin}
      EVA_ADMIN_BOOTSTRAP_PASSWORD: ${EVA_ADMIN_BOOTSTRAP_PASSWORD:-}
    command: ["node", "dist/admin/bootstrap-index.js"]
    volumes:
      - type: bind
        source: ${EVA_SECRETS_MASTER_KEY_FILE:-/etc/evaself/secrets-master-key}
        target: /run/secrets/eva-secrets-master-key
        read_only: true
        bind:
          create_host_path: false
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    <<: [*restart, *logging]
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    container_name: evaself-admin-api
    environment:
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:${VALKEY_PORT}/2
      EVA_SECRETS_MASTER_KEY_FILE: /run/secrets/eva-secrets-master-key
      EVA_ADMIN_PORT: 8071
      EVA_ADMIN_BIND: 0.0.0.0
      EVA_ADMIN_LOG_LEVEL: ${EVA_AGENT_LOG_LEVEL:-info}
      # Отчёт Security Audit. Выключен по умолчанию: включает человек.
      EVA_SECURITY_AUDIT: ${EVA_SECURITY_AUDIT:-0}
      # Реестр версий артефактов и полный административный CRUD.
      # Оба выключены по умолчанию: включает человек.
      EVA_ARTIFACT_VERSIONS: ${EVA_ARTIFACT_VERSIONS:-0}
      EVA_ADMIN_CRUD: ${EVA_ADMIN_CRUD:-0}
      EVA_ENV: ${EVA_ENV:-production}
      EVA_UPDATER_SOCKET: /run/evaself-updater/updater.sock
      EVA_INTERNAL_AGENT_URL: http://eva-agent-service:${EVA_AGENT_PORT}
      # Панель правит настройки ASR/TTS и запускает их проверки — обе
      # операции идут в media-service по внутренней сети tools.
      EVA_MEDIA_SERVICE_URL: http://media-service:8090
      # Общий секрет с media-service. Без него панель получала HTTP 401
      # на каждом обращении: адрес был, ключа не было.
      #
      # Со стороны это выглядело загадочно — голосовые сообщения
      # работали, а панель нет. Разгадка в том, что распознаванием
      # занимается eva-agent-service, которому переменную передают
      # (см. его блок environment), а admin-api живёт отдельным
      # контейнером и не получал её вовсе.
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      EVA_OUTBOUND_HOST_ALLOWLIST: ${EVA_OUTBOUND_HOST_ALLOWLIST:-}
    command: ["node", "dist/admin/index.js"]
    volumes:
      - type: bind
        source: ${EVA_SECRETS_MASTER_KEY_FILE:-/etc/evaself/secrets-master-key}
        target: /run/secrets/eva-secrets-master-key
        read_only: true
        bind:
          create_host_path: false
      - admin_updater_socket:/run/evaself-updater
    networks: [edge, data, tools]
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      eva-updater:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8071/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Единственный привилегированный компонент административного контура.
  # Контракт команд фиксирован в updater-index.ts; произвольные shell-команды
  # по Unix socket не принимаются. admin-api Docker socket не получает.
  eva-updater:
    <<: [*restart, *logging]
    build:
      context: ./eva-agent-service
      target: updater
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE}
        DOCKER_CLI_VERSION: ${DOCKER_CLI_VERSION}
    image: evaself/eva-updater:0.1.0
    container_name: evaself-eva-updater
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node", "dist/admin/updater-index.js"]
    environment:
      EVA_UPDATER_SOCKET: /run/evaself-updater/updater.sock
      EVA_UPDATER_PROJECT_DIR: ${EVASELF_INSTALL_DIR:-/workspace}
      BACKUP_DIR: /var/backups/evaself
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - admin_updater_socket:/run/evaself-updater
      - .:${EVASELF_INSTALL_DIR:-/workspace}
      - ${BACKUP_DIR:-/var/backups/evaself}:/var/backups/evaself
      - type: bind
        source: ${EVA_SECRETS_MASTER_KEY_FILE:-/etc/evaself/secrets-master-key}
        target: /run/secrets/eva-secrets-master-key
        read_only: true
        bind:
          create_host_path: false
    networks: [data]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection('/run/evaself-updater/updater.sock').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  health-worker:
    <<: [*restart, *logging]
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    container_name: evaself-health-worker
    environment:
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:${VALKEY_PORT}/2
      EVA_UPDATER_SOCKET: /run/evaself-updater/updater.sock
      EVA_HEALTH_INTERVAL_SECONDS: ${EVA_HEALTH_INTERVAL_SECONDS:-60}
      EVA_HEALTH_TIMEOUT_MS: ${EVA_HEALTH_TIMEOUT_MS:-10000}
      EVA_ADMIN_LOG_LEVEL: ${EVA_AGENT_LOG_LEVEL:-info}
    command: ["node", "dist/admin/health-worker-index.js"]
    volumes:
      - admin_updater_socket:/run/evaself-updater
    networks: [edge, data, tools]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      eva-updater:
        condition: service_healthy
    # В образе eva-agent-service задан HTTP healthcheck основного API.
    # Worker не поднимает HTTP-порт: его процесс является единственной рабочей
    # нагрузкой контейнера, а tini завершит контейнер при падении Node.js.
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===================================================================
  # LLM ROUTER
  # ===================================================================
  # Единственная точка, через которую стек ходит в языковые модели.
  # Letta App Server настроен на него как на обычный OpenAI-совместимый
  # провайдер и больше не перенастраивается: цепочка резервов, circuit
  # breaker и бюджеты живут внутри роутера, поэтому переключение не
  # требует ни рестарта App Server, ни правки чего-либо на стороне Letta.
  #
  # Наружу не публикуется: сети agent и data, без ports.
  llm-router:
    <<: [*restart, *logging]
    build:
      context: ./eva-agent-service
      args:
        NODE_BASE_VERSION: ${NODE_BASE_VERSION}
    image: evaself/eva-agent-service:0.3.0
    container_name: evaself-llm-router
    environment:
      DATABASE_URL: postgresql://${EVA_DB_USER}:${EVA_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVA_DB_NAME}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:${VALKEY_PORT}/3
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY}
      EVA_ROUTER_API_KEY: ${EVA_ROUTER_API_KEY}
      EVA_ROUTER_PORT: 8073
      EVA_ROUTER_BIND: 0.0.0.0
      EVA_ROUTER_LOG_LEVEL: ${EVA_AGENT_LOG_LEVEL:-info}
      EVA_ROUTER_BREAKER_THRESHOLD: ${EVA_ROUTER_BREAKER_THRESHOLD:-3}
      EVA_ROUTER_BREAKER_WINDOW_MS: ${EVA_ROUTER_BREAKER_WINDOW_MS:-300000}
      EVA_ROUTER_BREAKER_COOLDOWN_MS: ${EVA_ROUTER_BREAKER_COOLDOWN_MS:-420000}
      EVA_DISTRIBUTED_LIMITS: ${EVA_DISTRIBUTED_LIMITS:-false}
      EVA_ROUTER_LIMIT_RESERVATION_TTL_MS: ${EVA_ROUTER_LIMIT_RESERVATION_TTL_MS:-300000}
      EVA_ROUTER_ROUTE_MAX_CONCURRENCY: ${EVA_ROUTER_ROUTE_MAX_CONCURRENCY:-64}
      EVA_ROUTER_ROUTE_MAX_RPM: ${EVA_ROUTER_ROUTE_MAX_RPM:-600}
      EVA_ROUTER_ROUTE_MAX_TPM: ${EVA_ROUTER_ROUTE_MAX_TPM:-2000000}
      EVA_ROUTER_MAX_RETRY_AFTER_MS: ${EVA_ROUTER_MAX_RETRY_AFTER_MS:-5000}
      EVA_ROUTER_RETRY_AFTER_JITTER_MS: ${EVA_ROUTER_RETRY_AFTER_JITTER_MS:-250}
    command: ["node", "dist/router/index.js"]
    networks: [agent, data]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8073/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===================================================================
  # ADMIN / DATA GUI
  # ===================================================================
  nocodb:
    <<: [*restart, *logging]
    image: ${NOCODB_IMAGE}:${NOCODB_VERSION}
    container_name: evaself-nocodb
    environment:
      # NocoDB metadata lives in its OWN database…
      NC_DB: "pg://${POSTGRES_HOST}:${POSTGRES_PORT}?u=${NOCODB_DB_USER}&p=${NOCODB_DB_PASSWORD}&d=${NOCODB_DB_NAME}"
      NC_PUBLIC_URL: https://${DOMAIN_NOCODB}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NC_INVITE_ONLY_SIGNUP: ${NC_INVITE_ONLY_SIGNUP}
      NC_DISABLE_TELE: ${NC_DISABLE_TELE}
      # Разрешаем NocoDB подключаться к PostgreSQL внутри Docker-сети. Без этой
      # настройки NocoDB отклоняет внутренний адрес сервиса `postgres`.
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
      # База `eva` подключается автоматически скриптом nocodb-connect.sh.
      EVA_PG_HOST: ${POSTGRES_HOST}
      EVA_PG_PORT: ${POSTGRES_PORT}
      EVA_PG_DATABASE: ${EVA_DB_NAME}
      EVA_PG_USER: ${EVA_DB_USER}
      EVA_PG_PASSWORD: ${EVA_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - nocodb_data:/usr/app/data
      - ./nocodb/init-eva.mjs:/opt/evaself/nocodb-init-eva.mjs:ro
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ===================================================================
  # FRONT-END & SUPPORT SERVICES
  # ===================================================================
  webapp:
    <<: [*restart, *logging]
    build:
      context: ./webapp
      args:
        CADDY_IMAGE: ${CADDY_IMAGE}
        CADDY_VERSION: ${CADDY_VERSION}
    image: evaself/webapp:0.1.0
    container_name: evaself-webapp
    environment:
      EVA_API_BASE: https://${DOMAIN_API}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  searxng:
    <<: [*restart, *logging]
    image: ${SEARXNG_IMAGE}:${SEARXNG_VERSION}
    container_name: evaself-searxng
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng_cache:/var/cache/searxng
    networks: [tools]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  media-service:
    <<: [*restart, *logging]
    build:
      context: ./media-service
      args:
        PYTHON_BASE_VERSION: ${PYTHON_BASE_VERSION}
    image: evaself/media-service:0.1.0
    container_name: evaself-media-service
    environment:
      MEDIA_ASR_BASE_URL: ${MEDIA_ASR_BASE_URL}
      MEDIA_ASR_API_KEY: ${MEDIA_ASR_API_KEY}
      MEDIA_ASR_MODEL: ${MEDIA_ASR_MODEL}
      MEDIA_TTS_BASE_URL: ${MEDIA_TTS_BASE_URL}
      MEDIA_TTS_API_KEY: ${MEDIA_TTS_API_KEY}
      MEDIA_TTS_MODEL: ${MEDIA_TTS_MODEL}
      MEDIA_TTS_VOICE: ${MEDIA_TTS_VOICE}
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB}
      MEDIA_MAX_AUDIO_SECONDS: ${MEDIA_MAX_AUDIO_SECONDS}
      MEDIA_TMP_TTL_SECONDS: ${MEDIA_TMP_TTL_SECONDS}
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      # Без EVA_ENV сервис считает себя production и отказывается стартовать
      # с пустым MEDIA_SERVICE_TOKEN: он тратит токен бота и платные ключи
      # ASR/TTS, а в сети compose его может вызвать любой контейнер.
      EVA_ENV: ${EVA_ENV:-production}
      EVA_TELEGRAM_BOT_TOKEN: ${EVA_TELEGRAM_BOT_TOKEN}
      TZ: ${TZ}
    volumes:
      - eva_media_shared:/data/media
    networks: [tools]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup-service:
    <<: [*restart, *logging]
    build:
      context: ./backup-service
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE}
        POSTGRES_VERSION: ${POSTGRES_VERSION}
    image: evaself/backup-service:0.1.0
    container_name: evaself-backup-service
    # Long-lived helper container: it holds a pg_dump/pg_restore pair
    # that exactly matches the server version, so scripts/backup.sh and
    # scripts/restore.sh never depend on host packages.
    entrypoint: ["/usr/local/bin/backup-service", "idle"]
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_SUPER_USER}
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD}
      EVA_DB_NAME: ${EVA_DB_NAME}
      NOCODB_DB_NAME: ${NOCODB_DB_NAME}
      LETTA_DB_NAME: ${LETTA_DB_NAME}
      TZ: ${TZ}
    volumes:
      - backup_work:/work
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===================================================================
  # TOOLS — устанавливаются всегда
  # ===================================================================
  # Crawl4AI раньше стоял за профилем "crawl4ai". Из-за этого на
  # установке, где профиль не включали, контейнера просто не было, а
  # панель пыталась перезапускать его через Docker API по имени — и
  # молча ничего не делала. Сервис нужен инструментам Евы для чтения
  # веб-страниц, поэтому ставится наравне с остальными.
  crawl4ai:
    <<: [*restart, *logging]
    image: ${CRAWL4AI_IMAGE}:${CRAWL4AI_VERSION}
    container_name: evaself-crawl4ai
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN}
      TZ: ${TZ}
    volumes:
      - ./crawl4ai/config.yml:/app/config.yml:ro
    shm_size: 1gb
    networks: [tools]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===================================================================
  # OPTIONAL — enabled via COMPOSE_PROFILES in .env
  # ===================================================================
  uptime-kuma:
    <<: [*restart, *logging]
    profiles: ["monitoring"]
    image: ${UPTIME_KUMA_IMAGE}:${UPTIME_KUMA_VERSION}
    container_name: evaself-uptime-kuma
    environment:
      TZ: ${TZ}
    volumes:
      - uptime_kuma_data:/app/data
    networks: [edge]

# ---------------------------------------------------------------------
# Segmented networks.
#
# A single flat bridge meant that a compromise of any container that
# processes untrusted external content — SearXNG, crawl4ai — reached
# PostgreSQL, Valkey, the App Server and Caddy's admin API directly.
#
#   edge   Caddy and everything Caddy proxies
#   data   PostgreSQL, Valkey and their clients
#   agent  eva-agent-service <-> Letta App Server, nothing else
#   tools  SearXNG, media-service, crawl4ai
#
# eva-agent-service is in every segment — the hub role the architecture
# already gives it. admin-api and health-worker span edge/data/tools
# because they probe the service catalog in src/admin/service-catalog.ts;
# neither needs to reach the App Server, which stays alone with its only
# client on `agent`.
# ---------------------------------------------------------------------
networks:
  edge:
    name: evaself-edge
    driver: bridge
  data:
    name: evaself-data
    driver: bridge
  agent:
    name: evaself-agent
    driver: bridge
  tools:
    name: evaself-tools
    driver: bridge

volumes:
  validated_skills:
    name: evaself_validated_skills
  postgres_data:
    name: evaself_postgres_data
  valkey_data:
    name: evaself_valkey_data
  caddy_data:
    name: evaself_caddy_data
  caddy_config:
    name: evaself_caddy_config
  letta_app_server_data:
    name: evaself_letta_app_server_data
  letta_provider_config:
    name: evaself_letta_provider_config
  letta_llm_control:
    name: evaself_letta_llm_control
  admin_updater_socket:
    name: evaself_admin_updater_socket
  nocodb_data:
    name: evaself_nocodb_data
  searxng_cache:
    name: evaself_searxng_cache
  eva_media_shared:
    name: evaself_media_shared
  backup_work:
    name: evaself_backup_work
  uptime_kuma_data:
    name: evaself_uptime_kuma_data
