# Базы доступны node; обновление не зависит от прав root и не пишет в
# системный logfile. При недоступности CDN scanner использует прежнюю базу.
DatabaseDirectory /var/lib/clamav
DatabaseOwner node
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ConnectTimeout 10
ReceiveTimeout 30
MaxAttempts 2
