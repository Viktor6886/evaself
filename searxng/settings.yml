# =====================================================================
# SearXNG for Evaself
# ---------------------------------------------------------------------
# Reachable only from the evaself-tools segment: eva-agent-service calls
# http://searxng:8080/search?format=json. It is never routed by Caddy.
# =====================================================================
use_default_settings: true

general:
  instance_name: "Evaself Search"
  debug: false
  # No public instance, so no contact page is needed.
  enable_metrics: false

server:
  base_url: false
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "" # replaced from SEARXNG_SECRET at container start
  limiter: true
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  # "auto" — определить язык по самому запросу. Пустое значение означало
  # «взять язык браузера», а браузера здесь нет: запрос на русском получал
  # международную выдачу вперемешку. Явный язык инструмент передаёт
  # параметром запроса, это значение работает, когда он его не назвал.
  default_lang: "auto"
  # JSON is what the Agent SDK tool consumes; html stays on for debugging
  # from inside the network.
  formats:
    - html
    - json

ui:
  static_use_hash: true
  infinite_scroll: false
  default_theme: simple

outgoing:
  # Восемь секунд, а не шесть. Движок, не уложившийся в срок, попадает в
  # `unresponsive_engines`, и его результаты теряются целиком — а на
  # загруженной машине шести секунд не хватало и работающим движкам.
  # Потолок инструмента — двадцать секунд, так что запас есть.
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
  enable_http2: true

# Состав движков подобран под одно обстоятельство: Evaself живёт на VPS,
# а с адреса дата-центра большинство поисковиков отвечает капчей или
# отказом. Google, Startpage и Brave оставлены — где-то они работают, —
# но полагаться на них нельзя, и рядом обязаны стоять те, кто не
# спрашивает, кто ты: Mojeek и Qwant не блокируют дата-центры и не имеют
# жёсткого лимита. Раньше их обоих здесь не было, и на машине, где
# первые трое молчат, поиск возвращал пустоту.
#
# Сверено с умолчаниями образа `searxng/searxng:2026.7.26-b060c780d`:
# `mojeek`, `mojeek news`, `qwant`, `qwant news` и `bing` выключены в
# defaults, поэтому их нужно включать явно.
engines:
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: google
    disabled: false
  # Mojeek ищет своим индексом и не блокирует дата-центры: на машине, с
  # которой не отвечает никто другой, отвечает он.
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  # Bing здесь был выключен как «шумный». Лимит у него действительно
  # есть, но пустая выдача хуже шумной: он остаётся одним из немногих,
  # кто отвечает с адреса дата-центра.
  - name: bing
    disabled: false
  # Новости. В умолчаниях образа включены только те, кто чаще всего и
  # блокирует дата-центры (`google news`, `startpage news`, `brave.news`,
  # `bing news`, `yahoo news`), поэтому «новости за неделю» возвращали
  # пустоту. Эти двое выключены в defaults и не блокируют.
  - name: mojeek news
    disabled: false
  - name: qwant news
    disabled: false

  # Погода. Отдельная категория `weather`: в общий поиск движок не
  # попадает, его запрашивают явным `categories=weather`. Без него на
  # «погода в Москве» приходили статьи о погоде, а не погода. Движок
  # описан целиком, а не одним переключателем `disabled`, чтобы не
  # зависеть от того, есть ли он в defaults конкретного образа.
  - name: wttr.in
    engine: wttr
    shortcut: wttr
    timeout: 9.0
    disabled: false
