<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Ева</title>
		<link rel="stylesheet" href="/assets/styles.css" />
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<style>
			body {
				background: var(--tg-theme-bg-color, var(--bg));
				color: var(--tg-theme-text-color, var(--text));
			}
			.wrap {
				padding: var(--space);
				max-width: 560px;
			}
			.skeleton {
				height: 14px;
				border-radius: 6px;
				background: var(--border);
				animation: pulse 1.4s ease-in-out infinite;
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.45;
				}
			}
		</style>
	</head>
	<body>
		<main class="wrap">
			<header class="row" style="margin-bottom: 20px">
				<div>
					<p class="eyebrow" style="margin: 0">Ева</p>
					<h1 style="font-size: 22px; margin: 2px 0 0" id="greeting">
						<span class="skeleton" style="display: block; width: 160px"></span>
					</h1>
				</div>
				<span class="badge" id="plan">…</span>
			</header>

			<div id="error" class="status error" hidden></div>

			<section>
				<h2 style="margin-top: 0">Лимиты на сегодня</h2>
				<div id="quotas">
					<div class="card"><div class="skeleton"></div></div>
					<div class="card"><div class="skeleton"></div></div>
				</div>
			</section>

			<section>
				<h2>Задачи и практики</h2>
				<div class="card" id="tasks">
					<div class="skeleton"></div>
				</div>
			</section>

			<footer>
				<p class="small">
					Ева — не психотерапевт и не ставит диагнозов. Это инструмент
					самонаблюдения.
				</p>
			</footer>
		</main>

		<script src="/app/app.js"></script>
	</body>
</html>
