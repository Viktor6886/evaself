<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f3" />
  <meta name="color-scheme" content="light" />
  <title>Ева</title>
  <!-- The stylesheet is a render-blocking <link> on purpose: the doodle
       layout must be in place before the first paint, otherwise Telegram
       shows a flash of unstyled markup on a cold open. -->
  <link rel="stylesheet" href="/app/app.css?v=20260730-doodle1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="is-today">
  <div class="app">
    <main id="screens">

      <!-- =============================================================
           СЕГОДНЯ — единственный экран, который обязан помещаться
           целиком, без вертикальной прокрутки.
           ============================================================= -->
      <section class="screen home-screen" id="screen-today" data-screen="today">

        <header class="home-header">
          <h1 class="greeting">
            <span class="greeting-text" id="greeting-text">Доброе утро</span>
            <span class="greeting-heart" aria-hidden="true">
              <svg viewBox="0 0 24 22"><path d="M12 21 3 12C-1 7 5 0 10 5l2 2 2-2c5-5 11 2 7 7Z"/></svg>
            </span>
            <svg class="greeting-flourish" viewBox="0 0 40 22" aria-hidden="true">
              <path d="M2 6c6 0 9 3 11 7 2 5 8 6 10 2 2-3-2-6-5-4-4 3-2 9 4 9 5 0 9-4 11-9"/>
            </svg>
          </h1>
          <button class="bell-button" id="notifications-button" type="button" aria-label="Уведомления">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M10 28c2.5-2.5 4-5.5 4-10.5a6 6 0 0 1 12 0c0 5 1.5 8 4 10.5Z"/>
              <path d="M16.4 31.5a3.8 3.8 0 0 0 7.2 0M20 11.5V8"/>
            </svg>
            <span class="notification-dot is-live" id="notification-dot" aria-hidden="true"></span>
          </button>
        </header>

        <section class="state-card doodle-card" aria-labelledby="state-title">
          <div class="state-main">
            <div class="state-heading">
              <svg class="heading-sparks" viewBox="0 0 14 20" aria-hidden="true">
                <path d="M11 3 6 7M9 11 3 13M12 17l-4-2"/>
              </svg>
              <h2 id="state-title">Как я сейчас?</h2>
            </div>
            <div class="state-metrics">
              <button class="state-metric" type="button" data-checkin="mood">
                <span class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="16"/>
                    <circle cx="14.5" cy="16.5" r="1.6" class="fill-ink no-stroke"/>
                    <circle cx="25.5" cy="16.5" r="1.6" class="fill-ink no-stroke"/>
                    <path d="M13 24c4 4.5 10 4.5 14 0"/>
                  </svg>
                </span>
                <span class="metric-copy"><small>Настроение</small><strong id="mood-value">Отметить</strong></span>
              </button>
              <button class="state-metric" type="button" data-checkin="energy">
                <span class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 40">
                    <path class="fill-paper" d="M23 3 11 22h8l-3 15 13-20h-8Z"/>
                  </svg>
                </span>
                <span class="metric-copy"><small>Энергия</small><strong id="energy-value">— / 10</strong></span>
              </button>
              <button class="state-metric" type="button" data-checkin="focus">
                <span class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 40">
                    <circle cx="18" cy="22" r="14"/>
                    <circle cx="18" cy="22" r="8"/>
                    <circle cx="18" cy="22" r="2.4" class="fill-ink no-stroke"/>
                    <path d="m21 19 14-14M28 5h7v7"/>
                  </svg>
                </span>
                <span class="metric-copy"><small>Фокус</small><strong id="focus-value">— / 10</strong></span>
              </button>
            </div>
          </div>

          <span class="balloon" aria-hidden="true">
            <svg viewBox="0 0 92 132">
              <path class="balloon-body" d="M46 6C24 6 12 24 14 47c2 24 15 42 32 47 17-5 30-23 32-47C80 24 68 6 46 6Z"/>
              <circle cx="37" cy="44" r="2.6" class="fill-ink no-stroke"/>
              <circle cx="55" cy="44" r="2.6" class="fill-ink no-stroke"/>
              <path d="M33 55c6 12 20 12 26 0"/>
              <path class="fill-paper" d="M41 93c-1 5-4 7-5 10h20c-1-3-4-5-5-10Z"/>
              <path d="M48 103c2 8 12 5 14 11 2 5-4 8-7 4-2-4 3-7 6-4"/>
              <path d="M11 17 5 11M21 8 18 1M6 32 1 30" class="thin"/>
            </svg>
          </span>
        </section>

        <section class="result-card doodle-card" aria-labelledby="result-label">
          <span class="result-star" aria-hidden="true">
            <svg viewBox="0 0 44 42"><path d="m22 3 6 12 13 2-9.5 9.5L34 39l-12-6.5L10 39l2.5-12.5L3 17l13-2Z"/></svg>
          </span>
          <span class="result-copy">
            <small id="result-label">Главный результат дня</small>
            <strong id="main-result">Загрузка…</strong>
            <span class="result-underline" aria-hidden="true">
              <svg viewBox="0 0 190 6" preserveAspectRatio="none"><path d="M2 4c34-3 62-3 92-1 30 2 60 1 94-1"/></svg>
            </span>
          </span>
          <button class="ghost-button" id="edit-result" type="button">Изменить</button>
        </section>

        <section class="quick-actions" aria-label="Быстрые действия">
          <button class="quick-action is-accent" type="button" data-quick="journal">
            <span class="quick-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <path class="fill-orange" d="m8 36 2-9L28 9l7 7-18 18Z"/>
                <path d="m8 36 2-9L28 9l7 7-18 18Zm2-9 7 7M26 11l7 7"/>
                <path class="stroke-orange" d="M12 40c6-2 12-2 18 1"/>
              </svg>
            </span>
            <span class="quick-label">Записать</span>
          </button>
          <button class="quick-action" type="button" data-quick="focus">
            <span class="quick-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <circle cx="19" cy="25" r="15"/>
                <circle cx="19" cy="25" r="9"/>
                <circle cx="19" cy="25" r="3"/>
                <path d="m22 22 17-17M31 5h9v9"/>
              </svg>
            </span>
            <span class="quick-label">Фокус</span>
          </button>
          <button class="quick-action" type="button" data-quick="eva">
            <span class="quick-icon" aria-hidden="true">
              <!-- Same construction as the floating portrait, so the two
                   drawings of Eva stay recognisably one character. -->
              <svg viewBox="0 0 80 80">
                <path class="fill-orange" d="M20 80c1-14 9-21 20-21s19 7 20 21Z"/>
                <path class="fill-peach" d="M19 44c-3-20 6-32 21-32s24 12 21 32c2 8 1 20-3 27-2-14-4-22-4-30-9 4-22 3-28-3-1 9-2 19-4 33-4-7-5-19-3-27Z"/>
                <path class="fill-skin" d="M26 36c0-11 6-18 14-18s14 7 14 18-6 17-14 17-14-6-14-17Z"/>
                <path class="fill-peach" d="M25 34c-2-13 5-21 15-21s17 8 15 21c-2-6-5-9-8-10-4 3-13 4-17 1-2 2-4 5-5 9Z"/>
                <circle cx="34" cy="36" r="1.7" class="fill-ink no-stroke"/>
                <circle cx="46" cy="36" r="1.7" class="fill-ink no-stroke"/>
                <path class="thin" d="M31 32c1.5-1.5 4-1.5 5.5-.5M43.5 31.5c1.5-1 4-1 5.5.5"/>
                <path d="M36.5 44c2 1.6 5 1.6 7 0"/>
                <path class="fill-orange no-stroke" d="M11 5c3.6-4.7 9.8.5 4.1 6.2L11 15.4l-4.1-4.2C1.2 5.5 7.4.3 11 5Z"/>
                <path class="fill-orange no-stroke" d="M67 15c2.4-3.1 6.5.3 2.7 4.1L67 21.9l-2.7-2.8c-3.8-3.8.3-7.2 2.7-4.1Z"/>
              </svg>
            </span>
            <span class="quick-label">Ева</span>
          </button>
          <button class="quick-action" type="button" data-quick="practice">
            <span class="quick-icon" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <path d="M22 38c-2-11-8-17-19-16 3 10 9 15 19 16Zm0 0c2-11 8-17 19-16-3 10-9 15-19 16Zm0-1c-9-7-11-17-6-25 8 6 10 15 6 25Zm0 0c9-7 11-17 6-25-8 6-10 15-6 25Z"/>
              </svg>
            </span>
            <span class="quick-label">Практика</span>
          </button>
        </section>

        <section class="modules-area" aria-label="Модули Евы">
          <div class="modules-grid" id="modules-grid"></div>

          <span class="doodle-trail" aria-hidden="true">
            <svg viewBox="0 0 150 44">
              <path class="trail-line" d="M4 35c10 7 15-6 23-4s6 10 13 10c9 0 15-6 21-11 8-7 19-12 30-15"/>
              <path class="trail-heart" d="M60 22c2.6-3.6 7.2.5 3 4.6L60 30l-3-3.4c-4.2-4.1.4-8.2 3-4.6Z"/>
            </svg>
          </span>

          <button class="eva-floating-button" id="eva-fab" type="button"
                  aria-label="Открыть помощника Ева" aria-expanded="false">
            <svg class="eva-portrait" viewBox="0 0 80 80" aria-hidden="true">
              <defs>
                <clipPath id="eva-clip"><circle cx="40" cy="40" r="37"/></clipPath>
              </defs>
              <g clip-path="url(#eva-clip)">
                <rect x="0" y="0" width="80" height="80" class="fill-paper no-stroke"/>
                <!-- shoulders / orange top -->
                <path class="fill-orange" d="M18 84c1-16 9-24 22-24s21 8 22 24Z"/>
                <!-- hair, long and wavy -->
                <path class="fill-peach" d="M19 44c-3-20 6-32 21-32s24 12 21 32c2 8 1 20-3 27-2-14-4-22-4-30-9 4-22 3-28-3-1 9-2 19-4 33-4-7-5-19-3-27Z"/>
                <!-- face -->
                <path class="fill-skin" d="M26 36c0-11 6-18 14-18s14 7 14 18-6 17-14 17-14-6-14-17Z"/>
                <!-- fringe -->
                <path class="fill-peach" d="M25 34c-2-13 5-21 15-21s17 8 15 21c-2-6-5-9-8-10-4 3-13 4-17 1-2 2-4 5-5 9Z"/>
                <circle cx="34" cy="36" r="1.7" class="fill-ink no-stroke eva-blink"/>
                <circle cx="46" cy="36" r="1.7" class="fill-ink no-stroke eva-blink"/>
                <path d="M31 32c1.5-1.5 4-1.5 5.5-.5M43.5 31.5c1.5-1 4-1 5.5.5" class="thin"/>
                <path d="M36.5 44c2 1.6 5 1.6 7 0"/>
                <!-- little white heart on the top -->
                <path class="fill-paper" d="M40 66c2-3 6 0 2.6 3.6L40 72l-2.6-2.4C34 66 38 63 40 66Z"/>
              </g>
              <circle cx="40" cy="40" r="37"/>
            </svg>
            <span class="eva-status-dot" aria-hidden="true"></span>
            <svg class="eva-sparks" viewBox="0 0 22 22" aria-hidden="true">
              <path d="M13 2 12 8M18 5l-3 4M21 11l-5 1"/>
            </svg>
          </button>
        </section>
      </section>

      <!-- ============================ РАЗВИТИЕ ======================== -->
      <section class="screen inner-screen" id="screen-goals" data-screen="goals" hidden>
        <div class="inner-header">
          <div><p class="kicker">Цели и движение</p><h2>Развитие</h2></div>
          <button class="ghost-button" id="add-goal" type="button">Добавить цель</button>
        </div>
        <div id="goals-content" class="loading-placeholder"></div>
      </section>

      <!-- ============================ ОРГАНАЙЗЕР ====================== -->
      <section class="screen inner-screen" id="screen-organizer" data-screen="organizer" hidden>
        <div class="inner-header"><div><p class="kicker">Задачи и заметки</p><h2>Органайзер</h2></div></div>
        <div id="organizer-content" class="loading-placeholder"></div>
      </section>

      <!-- ============================ ПУЛЬТ =========================== -->
      <section class="screen inner-screen" id="screen-pult" data-screen="pult" hidden>
        <div class="inner-header"><div><p class="kicker">Все возможности</p><h2>Пульт</h2></div></div>
        <div class="pult-grid" id="pult-grid"></div>
      </section>

      <!-- ============================ ОТЧЁТЫ ========================== -->
      <section class="screen inner-screen" id="screen-progress" data-screen="progress" hidden>
        <div class="inner-header"><div><p class="kicker">Результаты и динамика</p><h2>Отчёты</h2></div></div>
        <div id="progress-content" class="loading-placeholder"></div>
      </section>

      <!-- ============================ ПРОФИЛЬ ========================= -->
      <section class="screen inner-screen" id="screen-profile" data-screen="profile" hidden>
        <div class="inner-header"><div><p class="kicker">Контекст и настройки</p><h2>Профиль</h2></div></div>
        <div id="profile-content" class="loading-placeholder"></div>
      </section>

      <!-- ======================= ОТДЕЛЬНЫЙ МОДУЛЬ ===================== -->
      <section class="screen inner-screen" id="screen-module" data-screen="module" hidden>
        <div class="inner-header"><div><p class="kicker" id="module-kicker">Модуль</p><h2 id="module-title">Модуль</h2></div></div>
        <div id="module-content"></div>
      </section>
    </main>

    <nav class="bottom-navigation" aria-label="Основная навигация">
      <button class="nav-item is-active" type="button" data-target="today" aria-current="page">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path class="nav-fill" d="M3 15 16 4l13 11v13H19v-8h-6v8H3Z"/></svg>
        </span><span>Сегодня</span>
      </button>
      <button class="nav-item" type="button" data-target="goals">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 29V15"/><path class="nav-fill" d="M16 17C8 15 7 8 8 4c8 1 11 6 8 13Zm0-2c8-2 9-8 8-12-8 1-11 6-8 12Z"/></svg>
        </span><span>Развитие</span>
      </button>
      <button class="nav-item" type="button" data-target="organizer">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="22" rx="4"/><path d="M10 3v7M22 3v7M4 14h24"/><circle cx="11" cy="19" r="1.3" class="fill-ink no-stroke"/><circle cx="16" cy="19" r="1.3" class="fill-ink no-stroke"/><circle cx="21" cy="19" r="1.3" class="fill-ink no-stroke"/><circle cx="11" cy="24" r="1.3" class="fill-ink no-stroke"/><circle cx="16" cy="24" r="1.3" class="fill-ink no-stroke"/></svg>
        </span><span>Органайзер</span>
      </button>
      <button class="nav-item" type="button" data-target="pult">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M3 9h26M3 16h26M3 23h26"/><circle cx="11" cy="9" r="3.2" class="fill-paper"/><circle cx="21" cy="16" r="3.2" class="fill-paper"/><circle cx="14" cy="23" r="3.2" class="fill-paper"/></svg>
        </span><span>Пульт</span>
      </button>
      <button class="nav-item" type="button" data-target="profile">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="6"/><path d="M5 29c1-8 5-11 11-11s10 3 11 11"/></svg>
        </span><span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="notice" class="notice" role="status" hidden></div>

  <!-- ================= Bottom sheets ================= -->
  <dialog class="sheet" id="sheet">
    <div class="sheet-body">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <div><h2 id="sheet-title"></h2><p id="sheet-subtitle"></p></div>
        <button class="sheet-close" type="button" id="sheet-close" aria-label="Закрыть">×</button>
      </div>
      <div id="sheet-content"></div>
    </div>
  </dialog>

  <script src="/app/app.js?v=20260730-doodle1"></script>
</body>
</html>
